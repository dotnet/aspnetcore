          key: ${{ runner.os }}-activity-report-logs-dotnet/AspNetCore.Docs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-activity-report-logs-dotnet/AspNetCore.Docs-
            ${{ runner.os }}-activity-report-logs-
      - name: Download activity report logs in target repository
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ steps.side-repo-app-token.outputs.token }}
          GH_AW_CMD_PREFIX: gh aw
          GH_AW_TARGET_REPO_SLUG: "dotnet/AspNetCore.Docs"
        run: |
          ${GH_AW_CMD_PREFIX} logs \
            --repo "dotnet/AspNetCore.Docs" \
            --start-date -1w \
            --count 500 \
            --output ./.cache/gh-aw/activity-report-logs \
            --format markdown \
            --report-file ./.cache/gh-aw/activity-report-logs/report.md

      - name: Save activity report logs cache
