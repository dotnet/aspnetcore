            const repoSlug = process.env.GH_AW_TARGET_REPO_SLUG || '';
            const [owner, repo] = repoSlug.split('/');
            if (!owner || !repo) {
              core.setFailed('Invalid GH_AW_TARGET_REPO_SLUG: ' + repoSlug);
              return;
            }
            const body = [
              '### Agentic workflow activity report',
              '',
              'Repository: ' + repoSlug,
              'Generated at: ' + new Date().toISOString(),
              '',
              reportBody,
            ].join('\n');
