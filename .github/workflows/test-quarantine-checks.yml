name: Quarantine workflow checks

on:
  pull_request:
    paths:
      - '.github/workflows/test-quarantine-checks.yml'
      - '.github/workflows/test-quarantine.md'
      - '.github/workflows/test-quarantine.lock.yml'
      - '.github/workflows/shared/create-kbe.instructions.md'
      - '.github/workflows/scripts/test-quarantine/**'
      - '.github/skills/create-kbe/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quarantine fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Run quarantine handler fixtures
        run: node .github/workflows/scripts/test-quarantine/test_kbe_issue_handler.js

      - name: Run quarantine eligibility fixtures
        run: python3 -B .github/workflows/scripts/test-quarantine/test_collect_case_a_eligibility.py
