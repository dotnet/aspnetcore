name: Queue merged PR documentation check

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'dotnet/aspnetcore' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - name: Queue documentation analysis on main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request_target' || context.payload.action !== 'closed' ||
                context.repo.owner !== 'dotnet' || context.repo.repo !== 'aspnetcore' ||
                pr?.merged !== true || pr.base?.ref !== 'main') {
              return;
            }
            if (!Number.isSafeInteger(pr.number) || pr.number <= 0) {
              throw new Error('The merged event has an invalid source PR number.');
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: 'dotnet',
              repo: 'aspnetcore',
              workflow_id: 'pr-docs-check.lock.yml',
              ref: 'main',
              inputs: {
                source_repository: 'dotnet/aspnetcore',
                pr_number: String(pr.number),
                existing_draft: 'skip',
              },
            });
