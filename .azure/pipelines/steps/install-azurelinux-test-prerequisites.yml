steps:
- bash: |
    set -euo pipefail

    sudo dnf install -y --setopt=install_weak_deps=False msopenjdk-25 libatomic
    java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
    echo "##vso[task.setvariable variable=JAVA_HOME]$java_home"
  displayName: Install JDK and Node.js prerequisites
