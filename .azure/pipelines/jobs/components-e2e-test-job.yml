            sys.exit(1)
        PY
      displayName: Validate diagnostic E2E result (${{ parameters.runtimeName }}, Quarantined)
      condition: always()
    - task: PublishTestResults@2
      displayName: Publish E2E Test Results (${{ parameters.runtimeName }})
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '*.trx'
        searchFolder: '$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined'
        testRunTitle: ComponentsE2E-${{ parameters.runtimeName }}-$(AgentOsName)-$(BuildConfiguration)-xunit
      condition: always()
    - task: PublishTestResults@2
      displayName: Publish Quarantined E2E Test Results (${{ parameters.runtimeName }})
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '*.trx'
        searchFolder: '$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined'
        testRunTitle: Quarantine-${{ parameters.runtimeName }}-$(AgentOsName)-$(BuildConfiguration)-xunit
        mergeTestResults: true
      condition: always()

    artifacts:
    - name: Components_E2E_${{ parameters.runtimeName }}_Logs
      path: artifacts/log/
      publishOnError: true
      includeForks: true
    - name: Components_E2E_${{ parameters.runtimeName }}_Test_Logs
      path: '$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)'
      includeForks: true
      publishOnError: true
