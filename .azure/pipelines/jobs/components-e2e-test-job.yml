# components-e2e-test-job.yml
# Shared job definition for Components E2E tests.
# Used by both components-e2e-tests.yml and components-e2e-tests-internal.yml.

parameters:
- name: runtimeName
  type: string
  default: 'Mono'
- name: runtimeBuildArgs
  type: string
  default: ''
- name: buildRestoreArgs
  type: string
  default: '--no-restore'

jobs:
- template: default-build.yml
  parameters:
    jobName: Components_E2E_Test_${{ parameters.runtimeName }}
    jobDisplayName: "Test: Blazor E2E tests on Linux (${{ parameters.runtimeName }})"
    agentOs: Linux
    use1ESUbuntu: true
    isAzDOTestingJob: true
    enablePublishTestResults: false
    timeoutInMinutes: 120
    steps:
    - script: git submodule update --init
      displayName: Update submodules
    - script: ./restore.sh
      displayName: Run restore.sh
    - task: Cache@2
      displayName: Cache node_modules
      inputs:
        key: '"node_modules" | "node24" | "$(Agent.OS)" | $(Build.SourcesDirectory)/package-lock.json'
        restoreKeys: |
          "node_modules" | "node24" | "$(Agent.OS)"
        path: node_modules
        cacheHitVar: NODE_MODULES_CACHE_HIT
    - script: npm ci
      displayName: NPM install
      condition: ne(variables.NODE_MODULES_CACHE_HIT, 'true')
    - script: npm run build
      displayName: Build JS
    - script: .dotnet/dotnet build ./src/Components/test/E2ETest -c $(BuildConfiguration) ${{ parameters.buildRestoreArgs }} ${{ parameters.runtimeBuildArgs }}
      displayName: Build (${{ parameters.runtimeName }})
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        mkdir -p "$diagnostics_dir"

        export ASPNETCORE_TEMP_CI_MEDIA_DIAGNOSTICS=true
        export E2ETESTS_DefaultWaitTimeoutInSeconds=2
        export E2ETESTS_DefaultAfterFailureWaitTimeoutInSeconds=2
        set +e
        .dotnet/dotnet test ./src/Components/test/E2ETest \
          -c $(BuildConfiguration) \
          --no-build ${{ parameters.runtimeBuildArgs }} \
          --filter 'FullyQualifiedName=Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined&Quarantined!=true' \
          -p:VsTestUseMSBuildOutput=false \
          --logger:"trx%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Unquarantined.trx" \
          --logger:"html%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Unquarantined.html" \
          --results-directory "$results_dir" \
          | tee "$diagnostics_dir/e2e-test-output.log"

        test_exit=${PIPESTATUS[0]}
        set -e
        if grep -q "No test matches the given testcase filter" "$diagnostics_dir/e2e-test-output.log"
        then
          echo "##vso[task.logissue type=error] No tests matched the filter."

          exit 1
        fi

        exit "$test_exit"
      displayName: Run E2E tests (${{ parameters.runtimeName }})
      continueOnError: true
    - script: |
        set -eo pipefail
        route="Unquarantined"
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/$route"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        json_file="$diagnostics_dir/screenshot-inventory.json"
        text_file="$diagnostics_dir/screenshot-inventory.txt"
        mkdir -p "$diagnostics_dir"

        json_escape() {
          printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
        }

        printf 'Components screenshot inventory\nruntime=%s\nroute=%s\nattempt=%s\ntest=%s\n\n' \
          '${{ parameters.runtimeName }}' \
          "$route" \
          '$(System.JobAttempt)' \
          'Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined' > "$text_file"
        printf '[\n' > "$json_file"
        first=true

        inventory_root() {
          label="$1"
          root="$2"
          if [ -d "$root" ]; then
            while IFS= read -r -d '' file; do
              relative_path="${file#$(Build.SourcesDirectory)/}"
              byte_length=$(wc -c < "$file" | tr -d ' ')
              sha256=$(sha256sum "$file" | awk '{ print $1 }')
              printf '%s  %s  %s  %s\n' "$label" "$byte_length" "$sha256" "$relative_path" >> "$text_file"
              if [ "$first" = true ]; then
                first=false
              else
                printf ',\n' >> "$json_file"
              fi
              printf '  {"job":"%s","runtime":"%s","attempt":"%s","route":"%s","test":"%s","root":"%s","path":"%s","byteLength":%s,"sha256":"%s"}' \
                "$(Agent.JobName)" \
                "${{ parameters.runtimeName }}" \
                "$(System.JobAttempt)" \
                "$route" \
                "Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined" \
                "$(json_escape "$label")" \
                "$(json_escape "$relative_path")" \
                "$byte_length" \
                "$sha256" >> "$json_file"
            done < <(find "$root" -type f -name '*.png' -print0)
          fi
        }

        inventory_root "old-bin-screenshots" "$(Build.SourcesDirectory)/src/Components/test/E2ETest/bin/screenshots"
        inventory_root "old-bin-recursive" "$(Build.SourcesDirectory)/src/Components/test/E2ETest/bin"
        inventory_root "fixed-unquarantined" "$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined/screenshots/Attempt_$(System.JobAttempt)"
        inventory_root "fixed-quarantined" "$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined/screenshots/Attempt_$(System.JobAttempt)"

        printf '\n]\n' >> "$json_file"
      displayName: Inventory diagnostic E2E screenshots (${{ parameters.runtimeName }}, Unquarantined)
      condition: always()
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        trx_file="$results_dir/Microsoft.AspNetCore.Components.E2ETests.Unquarantined.trx"
        if [ ! -f "$trx_file" ]; then
          echo "##vso[task.logissue type=error] Missing TRX file '$trx_file'."
          exit 1
        fi

        result_count=$({ grep -o '<UnitTestResult ' "$trx_file" 2>/dev/null || true; } | wc -l | tr -d ' ')
        failed_count=$({ grep -o 'outcome="Failed"' "$trx_file" 2>/dev/null || true; } | wc -l | tr -d ' ')
        if [ "$result_count" != "1" ] || [ "$failed_count" != "1" ]; then
          echo "##vso[task.logissue type=error] Expected exactly one failed unquarantined diagnostic result, but saw result_count=$result_count failed_count=$failed_count."
          exit 1
        fi

        if ! grep -R "Current count: 2" "$trx_file" "$diagnostics_dir/e2e-test-output.log" > /dev/null 2>&1; then
          echo "##vso[task.logissue type=error] Expected wrong-count assertion text was not found for the unquarantined diagnostic result."
          exit 1
        fi
      displayName: Validate diagnostic E2E result (${{ parameters.runtimeName }}, Unquarantined)
      condition: always()
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        mkdir -p "$diagnostics_dir"

        export ASPNETCORE_TEMP_CI_MEDIA_DIAGNOSTICS=true
        export E2ETESTS_DefaultWaitTimeoutInSeconds=2
        export E2ETESTS_DefaultAfterFailureWaitTimeoutInSeconds=2
        set +e
        .dotnet/dotnet test ./src/Components/test/E2ETest \
          -c $(BuildConfiguration) \
          --no-build ${{ parameters.runtimeBuildArgs }} \
          --filter 'FullyQualifiedName=Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Quarantined&Quarantined=true' \
          -p:RunQuarantinedTests=true \
          -p:VsTestUseMSBuildOutput=false \
          --logger:"trx%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Quarantined.trx" \
          --logger:"html%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Quarantined.html" \
          --results-directory "$results_dir" \
          | tee "$diagnostics_dir/e2e-test-output.log"

        test_exit=${PIPESTATUS[0]}
        set -e
        if grep -q "No test matches the given testcase filter" "$diagnostics_dir/e2e-test-output.log"
        then
          echo "##vso[task.logissue type=error] No tests matched the filter."

          exit 1
        fi

        exit "$test_exit"
      displayName: Run Quarantined E2E tests (${{ parameters.runtimeName }})
      continueOnError: true
      condition: succeededOrFailed()
    - script: |
        set -eo pipefail
        route="Quarantined"
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/$route"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        json_file="$diagnostics_dir/screenshot-inventory.json"
        text_file="$diagnostics_dir/screenshot-inventory.txt"
        mkdir -p "$diagnostics_dir"

        json_escape() {
          printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
        }

        printf 'Components screenshot inventory\nruntime=%s\nroute=%s\nattempt=%s\ntest=%s\n\n' \
          '${{ parameters.runtimeName }}' \
          "$route" \
          '$(System.JobAttempt)' \
          'Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Quarantined' > "$text_file"
        printf '[\n' > "$json_file"
        first=true

        inventory_root() {
          label="$1"
          root="$2"
          if [ -d "$root" ]; then
            while IFS= read -r -d '' file; do
              relative_path="${file#$(Build.SourcesDirectory)/}"
              byte_length=$(wc -c < "$file" | tr -d ' ')
              sha256=$(sha256sum "$file" | awk '{ print $1 }')
              printf '%s  %s  %s  %s\n' "$label" "$byte_length" "$sha256" "$relative_path" >> "$text_file"
              if [ "$first" = true ]; then
                first=false
              else
                printf ',\n' >> "$json_file"
              fi
              printf '  {"job":"%s","runtime":"%s","attempt":"%s","route":"%s","test":"%s","root":"%s","path":"%s","byteLength":%s,"sha256":"%s"}' \
                "$(Agent.JobName)" \
                "${{ parameters.runtimeName }}" \
                "$(System.JobAttempt)" \
                "$route" \
                "Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Quarantined" \
                "$(json_escape "$label")" \
                "$(json_escape "$relative_path")" \
                "$byte_length" \
                "$sha256" >> "$json_file"
            done < <(find "$root" -type f -name '*.png' -print0)
          fi
        }

        inventory_root "old-bin-screenshots" "$(Build.SourcesDirectory)/src/Components/test/E2ETest/bin/screenshots"
        inventory_root "old-bin-recursive" "$(Build.SourcesDirectory)/src/Components/test/E2ETest/bin"
        inventory_root "fixed-unquarantined" "$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined/screenshots/Attempt_$(System.JobAttempt)"
        inventory_root "fixed-quarantined" "$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined/screenshots/Attempt_$(System.JobAttempt)"

        printf '\n]\n' >> "$json_file"
      displayName: Inventory diagnostic E2E screenshots (${{ parameters.runtimeName }}, Quarantined)
      condition: always()
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        trx_file="$results_dir/Microsoft.AspNetCore.Components.E2ETests.Quarantined.trx"
        if [ ! -f "$trx_file" ]; then
          echo "##vso[task.logissue type=error] Missing TRX file '$trx_file'."
          exit 1
        fi

        result_count=$({ grep -o '<UnitTestResult ' "$trx_file" 2>/dev/null || true; } | wc -l | tr -d ' ')
        failed_count=$({ grep -o 'outcome="Failed"' "$trx_file" 2>/dev/null || true; } | wc -l | tr -d ' ')
        if [ "$result_count" != "1" ] || [ "$failed_count" != "1" ]; then
          echo "##vso[task.logissue type=error] Expected exactly one failed quarantined diagnostic result, but saw result_count=$result_count failed_count=$failed_count."
          exit 1
        fi

        if ! grep -R "Current count: 2" "$trx_file" "$diagnostics_dir/e2e-test-output.log" > /dev/null 2>&1; then
          echo "##vso[task.logissue type=error] Expected wrong-count assertion text was not found for the quarantined diagnostic result."
          exit 1
        fi
      displayName: Validate diagnostic E2E result (${{ parameters.runtimeName }}, Quarantined)
      condition: always()
    - task: PublishTestResults@2
      displayName: Publish E2E Test Results (${{ parameters.runtimeName }})
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '*.trx'
        searchFolder: '$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined'
        testRunTitle: ComponentsE2E-${{ parameters.runtimeName }}-$(AgentOsName)-$(BuildConfiguration)-xunit
      condition: always()
    - task: PublishTestResults@2
      displayName: Publish Quarantined E2E Test Results (${{ parameters.runtimeName }})
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '*.trx'
        searchFolder: '$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined'
        testRunTitle: Quarantine-${{ parameters.runtimeName }}-$(AgentOsName)-$(BuildConfiguration)-xunit
        mergeTestResults: true
      condition: always()

    artifacts:
    - name: Components_E2E_${{ parameters.runtimeName }}_Logs
      path: artifacts/log/
      publishOnError: true
      includeForks: true
    - name: Components_E2E_${{ parameters.runtimeName }}_Test_Logs
      path: '$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)'
      includeForks: true
      publishOnError: true
