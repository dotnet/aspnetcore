# components-e2e-test-job.yml
# Shared job definition for Components E2E tests.
# Used by both components-e2e-tests.yml and components-e2e-tests-internal.yml.

parameters:
- name: runtimeName
  type: string
  default: 'Mono'
- name: runtimeBuildArgs
  type: string
  default: ''
- name: buildRestoreArgs
  type: string
  default: '--no-restore'

jobs:
- template: default-build.yml
  parameters:
    jobName: Components_E2E_Test_${{ parameters.runtimeName }}
    jobDisplayName: "Test: Blazor E2E tests on Linux (${{ parameters.runtimeName }})"
    agentOs: Linux
    use1ESUbuntu: true
    isAzDOTestingJob: true
    enablePublishTestResults: false
    timeoutInMinutes: 120
    steps:
    - script: git submodule update --init
      displayName: Update submodules
    - script: ./restore.sh
      displayName: Run restore.sh
    - task: Cache@2
      displayName: Cache node_modules
      inputs:
        key: '"node_modules" | "node24" | "$(Agent.OS)" | $(Build.SourcesDirectory)/package-lock.json'
        restoreKeys: |
          "node_modules" | "node24" | "$(Agent.OS)"
        path: node_modules
        cacheHitVar: NODE_MODULES_CACHE_HIT
    - script: npm ci
      displayName: NPM install
      condition: ne(variables.NODE_MODULES_CACHE_HIT, 'true')
    - script: npm run build
      displayName: Build JS
    - script: .dotnet/dotnet build ./src/Components/test/E2ETest -c $(BuildConfiguration) ${{ parameters.buildRestoreArgs }} ${{ parameters.runtimeBuildArgs }}
      displayName: Build (${{ parameters.runtimeName }})
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        mkdir -p "$diagnostics_dir"

        export ASPNETCORE_TEMP_CI_MEDIA_DIAGNOSTICS=true
        set +e
        .dotnet/dotnet test ./src/Components/test/E2ETest \
          -c $(BuildConfiguration) \
          --no-build ${{ parameters.runtimeBuildArgs }} \
          --filter 'FullyQualifiedName=Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined&Quarantined!=true' \
          -p:VsTestUseMSBuildOutput=false \
          --logger:"trx%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Unquarantined.trx" \
          --logger:"html%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Unquarantined.html" \
          --results-directory "$results_dir" \
          | tee "$diagnostics_dir/e2e-test-output.log"

        test_exit=${PIPESTATUS[0]}
        set -e
        if grep -q "No test matches the given testcase filter" "$diagnostics_dir/e2e-test-output.log"
        then
          echo "##vso[task.logissue type=error] No tests matched the filter."

          exit 1
        fi

        exit "$test_exit"
      displayName: Run E2E tests (${{ parameters.runtimeName }})
    - script: |
        set -eo pipefail
        route="Unquarantined"
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/$route"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        json_file="$diagnostics_dir/screenshot-inventory.json"
        text_file="$diagnostics_dir/screenshot-inventory.txt"
        mkdir -p "$diagnostics_dir"

        printf 'Components screenshot inventory\nruntime=%s\nroute=%s\nattempt=%s\ntest=%s\n\n' \
          '${{ parameters.runtimeName }}' \
          "$route" \
          '$(System.JobAttempt)' \
          'Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined' > "$text_file"
        python3 - "$json_file" "$text_file" "$(Build.SourcesDirectory)" "$diagnostics_dir/e2e-test-output.log" "$results_dir/Microsoft.AspNetCore.Components.E2ETests.Unquarantined.trx" "$(Agent.JobName)" "${{ parameters.runtimeName }}" "$(System.JobAttempt)" "$route" "Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined" <<'PY'
        import hashlib
        import json
        import pathlib
        import re
        import sys

        json_file, text_file, source_dir, output_log, trx_file, job, runtime, attempt, route, test = sys.argv[1:]
        source_path = pathlib.Path(source_dir).resolve()
        reported_paths = []
        for evidence in [pathlib.Path(output_log), pathlib.Path(trx_file)]:
            if evidence.exists():
                reported_paths.extend(re.findall(r"Screen shot captured at '([^']+\.png)'", evidence.read_text(errors="ignore")))

        items = []
        seen = set()
        for reported_path in reported_paths:
            path = pathlib.Path(reported_path)
            resolved = path.resolve()
            if resolved in seen or not resolved.exists():
                continue
            seen.add(resolved)
            relative = resolved.relative_to(source_path).as_posix() if resolved.is_relative_to(source_path) else resolved.as_posix()
            digest = hashlib.sha256(resolved.read_bytes()).hexdigest()
            root = "fixed-route" if "/artifacts/TestResults/" in resolved.as_posix() else "producer-reported"
            items.append({
                "job": job,
                "runtime": runtime,
                "attempt": attempt,
                "route": route,
                "test": test,
                "root": root,
                "path": relative,
                "byteLength": resolved.stat().st_size,
                "sha256": digest,
            })

        pathlib.Path(json_file).write_text(json.dumps(items, indent=2) + "\n")
        with pathlib.Path(text_file).open("a", encoding="utf-8") as writer:
            if not items:
                writer.write("No screenshot paths were reported by this diagnostic test result.\n")
            for item in items:
                writer.write(f"{item['root']}  {item['byteLength']}  {item['sha256']}  {item['path']}\n")
        PY
      displayName: Inventory diagnostic E2E screenshots (${{ parameters.runtimeName }}, Unquarantined)
      condition: always()
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Unquarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        trx_file="$results_dir/Microsoft.AspNetCore.Components.E2ETests.Unquarantined.trx"
        python3 - "$trx_file" "$diagnostics_dir/e2e-test-output.log" "Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Unquarantined" <<'PY'
        import pathlib
        import sys
        import xml.etree.ElementTree as ET

        trx_file, output_log, test_name = sys.argv[1:]
        trx_path = pathlib.Path(trx_file)
        if not trx_path.exists():
            print(f"##vso[task.logissue type=error] Missing TRX file '{trx_file}'.")
            sys.exit(1)

        root = ET.parse(trx_path).getroot()
        ns = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
        definitions = {
            unit_test.attrib["id"]: unit_test.attrib.get("name", "")
            for unit_test in root.findall(".//trx:UnitTest", ns)
        }
        results = [
            result
            for result in root.findall(".//trx:UnitTestResult", ns)
            if definitions.get(result.attrib.get("testId")) == test_name
        ]
        failed = [result for result in results if result.attrib.get("outcome") == "Failed"]
        if len(results) != 1 or len(failed) != 1:
            print(f"##vso[task.logissue type=error] Expected exactly one failed diagnostic result for {test_name}, but saw results={len(results)} failed={len(failed)}.")
            sys.exit(1)

        output = "".join(failed[0].itertext()) + pathlib.Path(output_log).read_text(errors="ignore")
        if "Current count: 2" not in output or "Current count: 1" not in output:
            print("##vso[task.logissue type=error] Expected post-click count1 evidence and wrong-count2 assertion text were not found in the diagnostic result.")
            sys.exit(1)
        PY
      displayName: Validate diagnostic E2E result (${{ parameters.runtimeName }}, Unquarantined)
      condition: always()
    - script: |
        set -eo pipefail
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Quarantined"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        mkdir -p "$diagnostics_dir"

        export ASPNETCORE_TEMP_CI_MEDIA_DIAGNOSTICS=true
        set +e
        .dotnet/dotnet test ./src/Components/test/E2ETest \
          -c $(BuildConfiguration) \
          --no-build ${{ parameters.runtimeBuildArgs }} \
          --filter 'FullyQualifiedName=Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Quarantined&Quarantined=true' \
          -p:RunQuarantinedTests=true \
          -p:VsTestUseMSBuildOutput=false \
          --logger:"trx%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Quarantined.trx" \
          --logger:"html%3BLogFileName=Microsoft.AspNetCore.Components.E2ETests.Quarantined.html" \
          --results-directory "$results_dir" \
          | tee "$diagnostics_dir/e2e-test-output.log"

        test_exit=${PIPESTATUS[0]}
        set -e
        if grep -q "No test matches the given testcase filter" "$diagnostics_dir/e2e-test-output.log"
        then
          echo "##vso[task.logissue type=error] No tests matched the filter."

          exit 1
        fi

        exit "$test_exit"
      displayName: Run Quarantined E2E tests (${{ parameters.runtimeName }})
      continueOnError: true
      condition: succeededOrFailed()
    - script: |
        set -eo pipefail
        route="Quarantined"
        results_dir="$(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/$route"
        diagnostics_dir="$results_dir/diagnostics/Attempt_$(System.JobAttempt)"
        json_file="$diagnostics_dir/screenshot-inventory.json"
        text_file="$diagnostics_dir/screenshot-inventory.txt"
        mkdir -p "$diagnostics_dir"

        printf 'Components screenshot inventory\nruntime=%s\nroute=%s\nattempt=%s\ntest=%s\n\n' \
          '${{ parameters.runtimeName }}' \
          "$route" \
          '$(System.JobAttempt)' \
          'Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Quarantined' > "$text_file"
        python3 - "$json_file" "$text_file" "$(Build.SourcesDirectory)" "$diagnostics_dir/e2e-test-output.log" "$results_dir/Microsoft.AspNetCore.Components.E2ETests.Quarantined.trx" "$(Agent.JobName)" "${{ parameters.runtimeName }}" "$(System.JobAttempt)" "$route" "Microsoft.AspNetCore.Components.E2ETest.Tests.ComponentRenderingTest.TemporaryDiagnostic_CounterClickScreenshot_Quarantined" <<'PY'
