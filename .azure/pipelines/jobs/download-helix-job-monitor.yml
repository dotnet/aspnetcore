# download-helix-job-monitor.yml
# Description:
#   Downloads the Microsoft.DotNet.Helix.JobMonitor tool nupkg directly from the public
#   dotnet-eng NuGet feed and publishes it as a pipeline artifact, so that a later
#   'HelixJobMonitor' job (via /eng/common/core-templates/job/helix-job-monitor.yml) can
#   consume it through that template's 'toolNupkgArtifactName' parameter.
#
#   This works around the fact that aspnetcore's .config/dotnet-tools.json is generated
#   dynamically at build time (see eng/tools/GenerateFiles/dotnet-tools.json.in) and isn't
#   checked into source control. The Helix Job Monitor template's default code path
#   (restoring the tool from that manifest) isn't usable here because a bare checkout of
#   this repo doesn't have the file, and no build/restore runs before the monitor job to
#   generate it.
#
# Parameters:
#   condition: string
#       A condition which can be used to skip the job completely.
#   dependsOn: string | [ string ]
#       For fan-out/fan-in. https://learn.microsoft.com/azure/devops/pipelines/yaml-schema?view=azure-devops&tabs=schema#job
parameters:
- name: condition
  type: string
  default: ''
- name: dependsOn
  type: object
  default: []

jobs:
- job: Download_Helix_Job_Monitor
  displayName: Download Helix Job Monitor
  timeoutInMinutes: 10
  ${{ if ne(length(parameters.dependsOn), 0) }}:
    dependsOn: ${{ parameters.dependsOn }}
  ${{ if ne(parameters.condition, '') }}:
    condition: ${{ parameters.condition }}
  pool:
    ${{ if eq(variables['System.TeamProject'], 'public') }}:
      name: $(DncEngPublicBuildPool)
      demands: ImageOverride -equals build.azurelinux.3.amd64.open
    ${{ else }}:
      name: $(DncEngInternalBuildPool)
      demands: ImageOverride -equals build.azurelinux.3.amd64
  steps:
  - bash: |
      set -euo pipefail

      # Matches the default 'toolPackageId' of the helix-job-monitor.yml template. The nupkg
      # file name's casing must match that value exactly: the template locates it on a
      # case-sensitive Linux agent via 'find -name "$packageId.*.nupkg"'.
      packageId='Microsoft.DotNet.Helix.JobMonitor'
      version='$(HelixJobMonitorVersion)'

      # Matches the default 'toolNupkgArtifactSubPath' of the helix-job-monitor.yml template.
      outDir="$(Build.ArtifactStagingDirectory)/packages/Release/NonShipping"
      mkdir -p "$outDir"

      lowerPackageId=$(echo "$packageId" | tr '[:upper:]' '[:lower:]')
      url="https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/flat2/$lowerPackageId/$version/$lowerPackageId.$version.nupkg"
      echo "Downloading $packageId $version from $url"
      curl --fail --retry 5 --retry-delay 5 --location \
        -o "$outDir/$packageId.$version.nupkg" \
        "$url"
    displayName: Download Helix Job Monitor nupkg

  - task: PublishPipelineArtifact@1
    displayName: Publish Helix Job Monitor artifact
    inputs:
      # The artifact root must contain 'packages/Release/NonShipping/<nupkg>' to match the
      # default 'toolNupkgArtifactSubPath' expected by the helix-job-monitor.yml template.
      targetPath: $(Build.ArtifactStagingDirectory)
      artifactName: HelixJobMonitorTool
