#
# See https://learn.microsoft.com/azure/devops/pipelines/yaml-schema for details on this file.
#

trigger: none
pr: none

parameters:
- name: skipTests
  default: false
  displayName: Skip tests?
  type: boolean
- name: produceBinlogs
  default: false
  displayName: Produce binlogs?
  type: boolean

variables:
- name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
  value: true
- name: GRADLE_USER_HOME
  value: $(Build.SourcesDirectory)/.gradle
- name: _TeamName
  value: AspNetCore
- name: _PublishUsingPipelines
  value: true
- name: PostBuildSign
  value: false
- name: _UseHelixOpenQueues
  value: ${{ ne(variables['System.TeamProject'], 'internal') }}
- name: _InternalRuntimeDownloadArgs
  value: ''
- name: _SignType
  value: ''
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- template: /eng/common/templates/variables/pool-providers.yml

jobs:
- ${{ if ne(parameters.skipTests, 'true') }}:
  - template: jobs/default-build.yml
    parameters:
      jobName: Windows_Test
      jobDisplayName: "Test: Windows Server x64"
      agentOs: Windows
      isAzDOTestingJob: true
      cancelTimeoutInMinutes: 30
      steps:
      - powershell: git submodule update --init
        displayName: Update submodules
      - powershell: |
          .\eng\build.cmd -ci -prepareMachine -nativeToolsOnMachine -Configuration $(BuildConfiguration) -all -pack -binaryLog `
            /p:SkipTestBuild=true `
            /p:SkipHelixReadyTests=true `
            /p:SkipIISNewHandlerTests=true `
            /p:SkipIISTests=true `
            /p:SkipIISExpressTests=true `
            /p:SkipIISNewShimTests=true `
            /p:RunTemplateTests=false `
            /p:RunBlazorPlaywrightTemplateTests=false `
            $(_InternalRuntimeDownloadArgs) `
            /p:DotNetSignType=$(_SignType)
        displayName: Build package/runtime graph
      - powershell: |
          .\eng\build.cmd -ci -prepareMachine -nativeToolsOnMachine -Configuration $(BuildConfiguration) `
            -projects src\ProjectTemplates\test\Templates.Tests\Templates.Tests.csproj `
            -NoBuildDeps -NoBuildInstallers `
            /p:OnlyTestProjectTemplates=true `
            /p:GenerateInstallers=false `
            /p:RunTemplateTests=false `
            /p:RunBlazorPlaywrightTemplateTests=false `
            /p:DotNetSignType=$(_SignType)
        displayName: Build template test imports
      - powershell: |
          $ErrorActionPreference = 'Continue'
          $env:ASPNETCORE_TEMP_CI_MEDIA_DIAGNOSTICS = 'true'

          .\.dotnet\dotnet test .\src\ProjectTemplates\test\Templates.Blazor.Tests\Templates.Blazor.Tests.csproj `
            -c $(BuildConfiguration) `
            --filter "FullyQualifiedName=BlazorTemplates.Tests.BlazorWebTemplateTest.TemporaryDiagnostic_BlazorWebTemplateVideo_Passes|FullyQualifiedName=BlazorTemplates.Tests.BlazorWebTemplateTest.TemporaryDiagnostic_BlazorWebTemplateVideo_Fails" `
            -p:RunTemplateTests=false `
            -p:RunBlazorPlaywrightTemplateTests=true `
            -p:OnlyTestProjectTemplates=true `
            -p:DoNotCleanUpTemplates=true `
            -p:VsTestUseMSBuildOutput=false `
            --logger:"trx;LogFileName=Templates.Blazor.Diagnostics.trx" `
            --results-directory "$(Build.SourcesDirectory)\artifacts\TestResults\$(BuildConfiguration)\Templates.Blazor.Tests\diagnostics\Attempt_$(System.JobAttempt)"

          exit $LASTEXITCODE
        displayName: Run diagnostic Blazor template tests
        continueOnError: true
      afterBuild:
      - powershell: |
          $diagnosticsDir = "$(Build.SourcesDirectory)\artifacts\TestResults\$(BuildConfiguration)\Templates.Blazor.Tests\diagnostics\Attempt_$(System.JobAttempt)"
          New-Item -ItemType Directory -Force -Path $diagnosticsDir | Out-Null

          $sourceRoot = "$(Build.SourcesDirectory)\src\ProjectTemplates\test\Templates.Blazor.Tests"
          $files = @()
          $binRoot = Join-Path $sourceRoot "bin\$(BuildConfiguration)"
          if (Test-Path $binRoot) {
              $files = @(Get-ChildItem -Path $binRoot -Recurse -File -Filter *.webm | Where-Object { $_.FullName -like '*\videos\*' })
          }

          $items = @($files | ForEach-Object {
              [pscustomobject]@{
                  job = "$(Agent.JobName)"
                  attempt = "$(System.JobAttempt)"
                  phase = "source-before-staging"
                  tests = "BlazorTemplates.Tests.BlazorWebTemplateTest.TemporaryDiagnostic_BlazorWebTemplateVideo_Passes;BlazorTemplates.Tests.BlazorWebTemplateTest.TemporaryDiagnostic_BlazorWebTemplateVideo_Fails"
                  root = "src/ProjectTemplates/test/Templates.Blazor.Tests/bin/$(BuildConfiguration)"
                  path = $_.FullName.Substring("$(Build.SourcesDirectory)\".Length).Replace('\', '/')
                  byteLength = $_.Length
                  sha256 = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              }
          })

          if ($items.Count -eq 0) {
              "[]" | Set-Content -Path (Join-Path $diagnosticsDir "template-video-source-before-staging.json")
              "No source WebM files found before staging." | Set-Content -Path (Join-Path $diagnosticsDir "template-video-source-before-staging.txt")
          } else {
              $items | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $diagnosticsDir "template-video-source-before-staging.json")
              $items | ForEach-Object { "$($_.byteLength)  $($_.sha256)  $($_.path)" } | Set-Content -Path (Join-Path $diagnosticsDir "template-video-source-before-staging.txt")
          }
        displayName: Inventory Blazor template videos before staging
        condition: always()
      - task: CopyFiles@2
        displayName: Collect Blazor template browser videos
        condition: always()
        inputs:
          sourceFolder: $(Build.SourcesDirectory)/src/ProjectTemplates/test/Templates.Blazor.Tests
          contents: 'bin\$(BuildConfiguration)\**\videos\**\*.webm'
          targetFolder: $(Build.SourcesDirectory)/artifacts/TestResults/$(BuildConfiguration)/Templates.Blazor.Tests/Attempt_$(System.JobAttempt)
          flattenFolders: false
      - powershell: |
          $diagnosticsDir = "$(Build.SourcesDirectory)\artifacts\TestResults\$(BuildConfiguration)\Templates.Blazor.Tests\diagnostics\Attempt_$(System.JobAttempt)"
          New-Item -ItemType Directory -Force -Path $diagnosticsDir | Out-Null

          $stagedRoot = "$(Build.SourcesDirectory)\artifacts\TestResults\$(BuildConfiguration)\Templates.Blazor.Tests\Attempt_$(System.JobAttempt)"
          $files = @()
          if (Test-Path $stagedRoot) {
              $files = @(Get-ChildItem -Path $stagedRoot -Recurse -File -Filter *.webm)
          }

          $items = @($files | ForEach-Object {
              [pscustomobject]@{
                  job = "$(Agent.JobName)"
                  attempt = "$(System.JobAttempt)"
                  phase = "staged-after-copy"
                  tests = "BlazorTemplates.Tests.BlazorWebTemplateTest.TemporaryDiagnostic_BlazorWebTemplateVideo_Passes;BlazorTemplates.Tests.BlazorWebTemplateTest.TemporaryDiagnostic_BlazorWebTemplateVideo_Fails"
                  root = "artifacts/TestResults/$(BuildConfiguration)/Templates.Blazor.Tests/Attempt_$(System.JobAttempt)"
                  path = $_.FullName.Substring("$(Build.SourcesDirectory)\".Length).Replace('\', '/')
                  byteLength = $_.Length
                  sha256 = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              }
          })

          if ($items.Count -eq 0) {
              "[]" | Set-Content -Path (Join-Path $diagnosticsDir "template-video-staged-after-copy.json")
              "No staged WebM files found after staging." | Set-Content -Path (Join-Path $diagnosticsDir "template-video-staged-after-copy.txt")
          } else {
              $items | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $diagnosticsDir "template-video-staged-after-copy.json")
              $items | ForEach-Object { "$($_.byteLength)  $($_.sha256)  $($_.path)" } | Set-Content -Path (Join-Path $diagnosticsDir "template-video-staged-after-copy.txt")
          }
        displayName: Inventory Blazor template videos after staging
        condition: always()
      - powershell: |
          $diagnosticsDir = "$(Build.SourcesDirectory)\artifacts\TestResults\$(BuildConfiguration)\Templates.Blazor.Tests\diagnostics\Attempt_$(System.JobAttempt)"
          $trxFile = Join-Path $diagnosticsDir "Templates.Blazor.Diagnostics.trx"
          if (!(Test-Path $trxFile)) {
              Write-Host "##vso[task.logissue type=error] Missing TRX file '$trxFile'."
              exit 1
          }

          [xml]$trx = Get-Content $trxFile
          $results = @($trx.TestRun.Results.UnitTestResult)
          $passed = @($results | Where-Object { $_.outcome -eq "Passed" }).Count
          $failed = @($results | Where-Object { $_.outcome -eq "Failed" }).Count
          if ($results.Count -ne 2 -or $passed -ne 1 -or $failed -ne 1) {
              Write-Host "##vso[task.logissue type=error] Expected exactly two template diagnostic results with one pass and one failure, but saw results=$($results.Count) passed=$passed failed=$failed."
              exit 1
          }

          if (!(Select-String -Path $trxFile -Pattern "Current count: 99" -Quiet)) {
              Write-Host "##vso[task.logissue type=error] Expected wrong-count assertion text was not found for the template diagnostic failure."
              exit 1
          }
        displayName: Validate diagnostic Blazor template results
        condition: always()
      artifacts:
      - name: Windows_Test_Logs_Attempt_$(System.JobAttempt)
        path: artifacts/log/
        publishOnError: true
        includeForks: true
      - name: Windows_Test_Results_Attempt_$(System.JobAttempt)
        path: artifacts/TestResults/
        publishOnError: true
        includeForks: true
