#
# See https://learn.microsoft.com/azure/devops/pipelines/yaml-schema for details on this file.
#

# Builds, signs, and publishes the out of band Microsoft.AspNetCore.Components.AI package on its own cadence.
trigger: none
pr: none

schedules:
- cron: "0 6 * * *"
  displayName: Daily Components.AI preview build
  branches:
    include:
    - main
  always: true

variables:
- name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
  value: true
- name: _TeamName
  value: AspNetCore
- name: _PublishUsingPipelines
  value: true
- name: _SignType
  value: real
- name: PostBuildSign
  value: true
- name: _BuildArgs
  value: /p:TeamName=$(_TeamName)
         /p:OfficialBuildId=$(Build.BuildNumber)
         /p:PostBuildSign=$(PostBuildSign)
- name: _PublishArgs
  value: /p:DotNetPublishUsingPipelines=$(_PublishUsingPipelines)
- name: _InternalRuntimeDownloadArgs
  value: -RuntimeSourceFeed https://ci.dot.net/internal
         -RuntimeSourceFeedKey $(dotnetbuilds-internal-container-read-token-base64)
         /p:DotNetAssetRootAccessTokenSuffix='$(dotnetbuilds-internal-container-read-token-base64)'
# Exclude artifacts & .packages folders from CodeQL scans
- name: LGTM_INDEX_FILTERS
  value: |
    exclude:.packages
    exclude:artifacts
- template: /eng/common/templates-official/variables/pool-providers.yml@self

resources:
  repositories:
  # Repo: 1ESPipelineTemplates/1ESPipelineTemplates
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean2
    sdl:
      sourceAnalysisPool:
        name: NetCore1ESPool-Svc-Internal
        image: windows.vs2022.amd64
        os: windows
      spotBugs:
        enabled: false
      policheck:
        enabled: true
      tsa:
        enabled: true

    stages:
    - stage: build
      displayName: Build
      jobs:
      - template: .azure/pipelines/jobs/default-build.yml@self
        parameters:
          jobName: Components_AI_Package
          jobDisplayName: "Build: Components.AI package"
          agentOs: Windows
          codeSign: true
          isAzDOTestingJob: true
          steps:
          - script: npm run build --workspace src/Components/Web.JS
            displayName: Build Blazor JavaScript

          - script: ./eng/build.cmd
                    -ci
                    -prepareMachine
                    -test
                    -projects src\Components\AI\test\Microsoft.AspNetCore.Components.AI.Tests.csproj
                    $(_BuildArgs)
                    $(_InternalRuntimeDownloadArgs)
                    /bl:artifacts/log/Release/Components.AI.Tests.binlog
            env:
              MSBUILDUSESERVER: "1"
            displayName: Build and test Components.AI

          - powershell: Remove-Item artifacts/packages -Recurse -Force -ErrorAction Ignore
            displayName: Clear packages produced by dependencies

          - script: ./eng/build.cmd
                    -ci
                    -prepareMachine
                    -pack
                    -sign
                    -publish
                    -noBuildDeps
                    -projects src\Components\AI\src\Microsoft.AspNetCore.Components.AI.csproj
                    /p:DotNetSignType=$(_SignType)
                    /p:AssetManifestFileName=components-ai.xml
                    $(_BuildArgs)
                    $(_PublishArgs)
                    $(_InternalRuntimeDownloadArgs)
                    /bl:artifacts/log/Release/Components.AI.Package.binlog
            env:
              MSBUILDUSESERVER: "1"
            displayName: Pack, sign, and publish Components.AI

          artifacts:
          - name: Components_AI_Logs_Attempt_$(System.JobAttempt)
            path: artifacts/log/
            publishOnError: true
            includeForks: false
          - name: Components_AI_Packages
            path: artifacts/packages/
            includeForks: false

      - template: /eng/common/templates-official/job/publish-build-assets.yml@self
        parameters:
          dependsOn:
          - Components_AI_Package
          pool:
            name: $(DncEngInternalBuildPool)
            demands: ImageOverride -equals 1es-windows-2022
          publishUsingPipelines: ${{ variables._PublishUsingPipelines }}
          enablePublishBuildArtifacts: true
          publishAssetsImmediately: true

    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 3
        enableSymbolValidation: false
        enableSigningValidation: false
        enableNugetValidation: false
        publishInstallersAndChecksums: false
        publishAssetsImmediately: true
