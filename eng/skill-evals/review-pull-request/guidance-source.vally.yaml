name: review-pull-request-committed-guidance
description: Committed local criteria and presentation, not full PR review quality.
version: "1"
type: capability

environment:
  skills: [../../../.github/skills/review-pull-request]
  files:
    - { src: ../../../docs/CrossCuttingGuidance.md, dest: docs/CrossCuttingGuidance.md }
    - { src: ../../../docs/BlazorComponentsGuidance.md, dest: docs/BlazorComponentsGuidance.md }
    - { src: ../../../CONTRIBUTING.md, dest: CONTRIBUTING.md }
    - { src: ../../../.github/copilot-instructions.md, dest: .github/copilot-instructions.md }
    - { src: ../../../src/Components/AGENTS.md, dest: src/Components/AGENTS.md }
    - { src: ../../../docs/APIReviewProcess.md, dest: docs/APIReviewProcess.md }
    - { src: ../../../docs/Trimming.md, dest: docs/Trimming.md }
    - { src: ../../../.github/skills/review-public-api/SKILL.md, dest: .github/skills/review-public-api/SKILL.md }
  commands:
    - |
      set -e
      git init -q -b eval-review
      git config user.name "Skill eval"
      git config user.email "skill-eval@example.invalid"
      python3 - <<'PY'
      from pathlib import Path
      for name, heading, marker in [
          ('docs/CrossCuttingGuidance.md', '## Overarching principles', 'COMMITTED-CRITERION'),
          ('.github/skills/review-public-api/SKILL.md', '## The rules reviewers apply most (highlights)', 'COMMITTED-API-CRITERION'),
      ]:
          p = Path(name)
          p.write_text(p.read_text().replace(heading + '\n', heading + '\n\n- ' + marker + '\n'))
      PY
      git add docs .github src CONTRIBUTING.md
      git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -qm Fixture
      python3 - <<'PY'
      from pathlib import Path
      for name in ['docs/CrossCuttingGuidance.md', '.github/skills/review-public-api/SKILL.md']:
          p = Path(name)
          p.write_text(p.read_text().replace('COMMITTED-', 'UNCOMMITTED-'))
      PY

defaults:
  runs: 1
  timeout: 300s
  executor: copilot-sdk
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
scoring:
  threshold: 1

stimuli:
  - name: committed-main-api-criteria
    tags: { suite: criteria }
    prompt: |
      Invoke review-pull-request for Step 2 criteria loading only. The supplied synthetic
      frozen routing input is a main-targeting PR changing public APIs in src/Example.cs.
      Include optional API design criteria. No complete PR evidence is supplied: exclude
      Step 1, authoritative target-document lookup, worker dispatch and actual review.
      Use shell for file I/O. Do not contact GitHub, edit, or publish.
      Return READY only after reading the applicable guides, delegated policies and API
      criteria; include their local commit provenance, the complete cross-cutting
      principles and the first API design criterion. Otherwise explain the block.
    graders:
      - &activation
        type: skill-invocation
        config: { required: [review-pull-request], disallowed: [review-public-api] }
      - &ready
        type: output-matches
        config: { pattern: '(?m)^(?:#{1,6} )?\*{0,2}READY\*{0,2}(?:\s|$)' }
      - &committed
        type: output-contains
        config: { substring: COMMITTED-CRITERION }
      - type: output-contains
        config: { substring: COMMITTED-API-CRITERION }
      - &no-dirty
        type: output-contains
        config: { substring: UNCOMMITTED-, negate: true }
      - &git-read
        type: tool-calls
        config:
          required: [{ name: '^(bash|shell|powershell)$', command: '\bshow\b' }]
      - &pinned-read
        type: tool-calls
        config:
          required: [{ name: '^(bash|shell|powershell)$', command: '(?s)(?=.*\bshow\b)(?=.*\b[0-9a-f]{40}\b)' }]
      - &read-only
        type: tool-calls
        config:
          disallowed:
            - { name: '^(task|rename_branch|rename_session|edit|create|apply_patch)$' }
            - { name: '^(bash|shell|powershell)$', command: 'git\s+(checkout|switch|commit|reset|merge|pull|fetch|push|rebase)\b' }

  - name: committed-release-criteria
    tags: { suite: criteria }
    prompt: |
      Invoke review-pull-request for criteria loading only, using this historical #69401
      routing projection, not complete PR evidence: head 3870288f23f7c80644e71b049f797ce783754aaa,
      base dotnet/aspnetcore release/11.0 at 13909f3b7ddbfeab04aac1c290f8abf4b75fe42c.
      Changed paths include eng/Versions.props and src/Components/test/E2ETest/Tests/StandaloneAppTelemetryTest.cs.
      Both guides are absent at that release base. Exercise only local guide and delegated
      policy loading; exclude Step 1, target-document lookup, workers and actual review.
      Use shell for file I/O. Do not contact GitHub, edit, or publish.
      Return READY only after reading the required criteria; include both guide paths,
      their local commit provenance and the complete cross-cutting principles.
    graders:
      - *activation
      - *ready
      - *committed
      - *no-dirty
      - *git-read
      - *pinned-read
      - *read-only
      - type: output-contains
        config: { substring: docs/BlazorComponentsGuidance.md }

  - name: missing-committed-guide
    tags: { suite: criteria }
    environment:
      commands:
        - |
          set -e
          git rm -qf docs/CrossCuttingGuidance.md
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -qm "Remove committed guide"
          git show HEAD^:docs/CrossCuttingGuidance.md > docs/CrossCuttingGuidance.md
    prompt: |
      Invoke review-pull-request for Step 2 criteria loading only, with a synthetic frozen
      main PR changing src/Example.cs. Use shell for file I/O; do not contact GitHub,
      edit, dispatch, or publish. Read the required criteria and report readiness or
      the actual blocking input. Do not perform a review.
    graders:
      - *activation
      - *git-read
      - *read-only
      - type: output-contains
        config: { substring: BLOCKED }
      - type: output-contains
        config: { substring: docs/CrossCuttingGuidance.md }
      - type: output-contains
        config: { substring: NO_FINDINGS, negate: true }

  - name: concise-result
    tags: { suite: presentation }
    prompt: |
      Invoke review-pull-request for Step 6 presentation only. Controlled completed-analysis
      input: PR dotnet/aspnetcore#1, MANIFEST expected=1 launched=1 returned=1.
      One medium lifecycle finding at src/Example.cs:12: Dispose removed Unsubscribe,
      so after Subscribe then Dispose the publisher retains and invokes the disposed
      subscriber. Source evidence is the removed Unsubscribe call. No regression test;
      Windows runtime behavior was not verified. Render this input without performing
      a review, reading files, dispatching, editing or publishing.
    graders:
      - *activation
      - *read-only
      - &concise
        type: output-matches
        config: { pattern: '(HEAD_SHA|BASE_SHA|LOCAL_SHA|GUIDANCE_\w+|MANIFEST|TOPICS|DISCARDED|TEST_BOUNDARY):', negate: true }
      - type: output-matches
        config: { pattern: 'src/Example\.cs(?::12|.{0,30}line 12)' }
      - type: output-matches
        config: { pattern: '(?i)publisher.*(retain|invoke)' }
      - &limitation
        type: output-matches
        config: { pattern: '(?i)Windows.{0,80}(not verified|unverified)' }

  - name: incomplete-result
    tags: { suite: presentation }
    prompt: |
      Invoke review-pull-request for Step 6 presentation only. Controlled analysis input:
      PR dotnet/aspnetcore#1, no findings, expected=1 launched=1 returned=0 because the
      worker did not finish; coverage is incomplete. Windows runtime behavior was not
      verified. Render this input without performing a review, reading files,
      dispatching, editing or publishing.
    graders:
      - *activation
      - *read-only
      - *concise
      - *limitation
      - type: output-matches
        config: { pattern: '(?i)incomplete|did not complete|could not complete' }
      - type: output-matches
        config: { pattern: '(?i)NO_FINDINGS|no (actionable |verified )?findings (were )?(found|identified)', negate: true }
