        head found false and the required-parameter mapping error.
      - Keep the concrete changed consumer-visible mapping error in NEW_FINDINGS with confidence verified. The
        lower-layer head test only calls FileConverter.TryRead and asserts succeeded, found false, and an empty result.
        It does not exercise construction or the required-parameter ErrorHandler path, so it is not exact-input intent
        evidence warranting a question downgrade.
      - Cite the changed RIGHT-side FileConverter found assignment, the base-tip required-parameter consumer, and the
        head test. Do not infer that result is null, that every unmatched optional file is a defect, or that the
        lower-layer test resolves the constructor regression.
