        exception to an error boundary. Head returns at the guard.
      - Reject C1's claim that the guard newly removes a previously functioning ErrorBoundary delivery on that exact
        post-disposal path. Record DISCARDED with the source-disproven effect, not merely a generic disposal rule. Also
        surface it inline with [DISCARDED], confidence discarded, and Why discarded.
      - Read the linked issue 66322 expectation and the actual head tests. They establish the intended no-throw disposed
        behavior and distinguish component removal with a live renderer. Do not manufacture a new intent question that
        contradicts the supplied issue or discard a genuine live-renderer exception.
