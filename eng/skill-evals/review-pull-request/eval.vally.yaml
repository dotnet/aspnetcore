    rubric:
      - All criteria are mandatory. C1 asserts that the new test server token endpoint changes the browser regression's
        observable success because the scenario completes a token exchange through that endpoint before its assertions.
        Do not treat a directly callable endpoint as evidence that this browser scenario calls it before asserting.
      - Inspect the copied token endpoint at mergeBase and head, the MSAL app configuration, the real signIn wrapper,
        and NavigateDirectlyToLoginCallbackRestartsLoginWithoutInteropFailure.
      - Trace the exact test execution order across RemoteMsalAuthenticationTest.cs and
        RemoteMsalAuthenticationApp.razor. Direct navigation to /subdir/msal-authentication/login-callback carries no
        authorization code, and the wrapper in RemoteMsalAuthenticationApp.razor sets window.__msalSignInCalled = true
        before delegating to AuthenticationService.signIn(state).
      - Because the test assertions run as soon as window.__msalSignInCalled is true and only check the browser log for
        the interop failure without awaiting any token exchange, C1's causal premise is contradicted by the frozen
        source. Place C1 in DISCARDED and surface it inline under NEW_FINDINGS with [DISCARDED], confidence discarded,
        and Why discarded.
      - Do not substitute a different endpoint correctness claim or remedy for C1's asserted browser effect.
