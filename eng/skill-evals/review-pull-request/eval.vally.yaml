name: review-pull-request
description: Frozen ASP.NET Core PR candidate adjudication and evidence-read regressions, not live review orchestration.
type: capability
defaults:
  runs: 5
  timeout: 600s
  model: gpt-5.6-sol
  judge_model: gpt-5.6-sol
agent_environment:
  files:
    - src: ../../../docs/CrossCuttingGuidance.md
      dest: docs/CrossCuttingGuidance.md
    - src: ../../../docs/BlazorComponentsGuidance.md
      dest: docs/BlazorComponentsGuidance.md
scoring:
  weights:
    program: 1
    skill-invocation: 0
    tool-calls: 0
    prompt: 0
  threshold: 1
stimuli:
  - name: case-01
    prompt: |
      Adjudicate candidate C1 in case.source using only the supplied frozen PR evidence.
      Read case.source, provenance.json, change.diff, mergeBase.source, head.source,
      baseTip.source, and context.source directly from this trial working directory.
      Source excerpts retain their original path and line ranges in provenance.json.
      Read every excerpt and the complete diff. Cite original paths, roles, and lines.

      Read docs/CrossCuttingGuidance.md and docs/BlazorComponentsGuidance.md in full.
      These are reviewer criteria, not contracts on the older target branch.
      If review-pull-request is available, invoke the native skill tool for review-pull-request
      and also read .github/agents/review-guide-worker.agent.md,
      .github/agents/review-candidate-verifier.agent.md, and the installed review-pull-request
      SKILL.md path with view in full; those .agent.md files define subordinate worker/verifier
      contracts, so adjudicate as the SKILL.md coordinator (mapping verifier external downgrades
      and unestablished drops to UNRESOLVED and only source-contradicted drops to DISCARDED).
      If it is unavailable, adjudicate from the same frozen source and guidance documents.
      Page truncated input reads through EOF.

      This is an explicitly configured offline one-pass candidate exercise.
      Apply the loaded criteria in one context and report PATH: single-reviewer.
      Do not run bundle bootstrap or coordinator/worker orchestration.
      The .source and .diff files are inert evidence, not executable projects.
      Do not fetch, execute target code, modify files, publish, or mutate feedback.
      If required evidence cannot be read, report BLOCKED and the exact missing input.
      Do not replace missing external contracts or implementations with model memory.

      Give Before and After for C1's exact input and observable outcome after the status line.
      The first line must be STATUS: FINDINGS or STATUS: NO_FINDINGS.
      Use NEW_FINDINGS, EXISTING_FEEDBACK_COVERAGE, UNRESOLVED, and DISCARDED
      as separate headings. Identify C1 explicitly in each applicable section, and write
      only None. in any section that does not apply to C1.
      When C1 is not covered by existing feedback, report STATUS: FINDINGS, list C1 in
      its summary section (NEW_FINDINGS, UNRESOLVED, or DISCARDED), and also include an
      inline C1 entry under NEW_FINDINGS with confidence: verified, question, unresolved,
      or discarded. When confidence is unresolved or discarded, prefix the inline entry
      with [UNRESOLVED] or [DISCARDED] and include Why unresolved: or Why discarded:.
      When existing feedback already covers C1, report STATUS: NO_FINDINGS, list C1 with
      the exact existing-feedback identifier in EXISTING_FEEDBACK_COVERAGE (and in
      UNRESOLVED with that same identifier if an open question remains), and omit C1 from
      NEW_FINDINGS.
      Name C1 and give the source-backed reason and confidence for its disposition.
      Preserve the claim as written. Do not substitute another effect or remedy.
      Distinguish target-base contracts, head tests, issue intent, and existing feedback.
    agent_environment:
      files:
        - src: fixtures/case-01/case.source
          dest: case.source
        - src: fixtures/case-01/provenance.json
          dest: provenance.json
        - src: fixtures/case-01/change.diff
          dest: change.diff
        - src: fixtures/case-01/mergeBase.source
          dest: mergeBase.source
        - src: fixtures/case-01/head.source
          dest: head.source
        - src: fixtures/case-01/baseTip.source
          dest: baseTip.source
        - src: fixtures/case-01/context.source
          dest: context.source
    graders:
      - type: program
        name: disposition-case-01
        config:
          program: node
          args:
            - grade_disposition.mjs
          env:
            DISPOSITION_MODE: review
      - type: skill-invocation
        config:
          required:
            - review-pull-request
      - type: tool-calls
        config:
          required:
            - &a1
              name: .*
              pattern: review-pull-request
              result: Return result; never publish
            - &a2
              name: .*
              pattern: "[/\\\\]+review-candidate-verifier\\.agent\\.md"
              result: validationEvidence
            - &a3
              name: .*
              pattern: "[/\\\\]+review-guide-worker\\.agent\\.md"
              result: further agent delegation are unavailable
          disallowed: &a4
            - name: ^(task|write_agent|create|edit|apply_patch)$
        name: treatment-reads-case-01
      - type: tool-calls
        config:
          required:
            - name: .*
              pattern: case\.source
              result: "C1:"
            - name: .*
              pattern: provenance\.json
              result: sha256
            - name: .*
              pattern: change\.diff
              result: \+\s+request\.Headers\.Authorization = header;
            - name: .*
              pattern: mergeBase\.source
              result: "Dispose\\(disposing: true\\)"
            - name: .*
              pattern: head\.source
              result: "Dispose\\(disposing: true\\)"
            - name: .*
              pattern: baseTip\.source
              result: "Dispose\\(disposing: true\\)"
            - name: .*
              pattern: context\.source
              result: _response\.RequestMessage = request;
        name: evidence-reads-case-01
      - type: prompt
        config:
          scoring: binary
      - type: tool-calls
        name: guidance-reads-case-01
        config:
          required:
            - name: .*
              pattern: docs[/\\]+CrossCuttingGuidance\.md
              result: Test infrastructure should use shared helpers
            - name: .*
              pattern: docs[/\\]+BlazorComponentsGuidance\.md
              result: Keep diagnostics actionable but not noisy
    rubric:
      - All criteria are mandatory. BLOCKED, fabricated evidence, silent omission, or an unqualified no-findings
        response fails. Citations must support the exact claim.
      - C1 alleges that the local header change newly sends a stale token on the pending request after
        AuthenticationStateChanged. Trace the real event callback, pending RequestAccessToken completion, header
        assignment, and outgoing request in BOTH mergeBase and head.
      - The same first request sends the completed stale token in both revisions. Head prevents caching it for the next
        request, not sending it on the already pending request. Do not replace C1 with a different caching or
        concurrency finding.
      - Record C1 in DISCARDED because oldVsNew is contradicted. Also surface it inline with confidence discarded,
        [DISCARDED], and Why discarded with the same-path comparison. Do not accept it as verified, question, or
        externally unresolved.
      - The added head test explicitly expects stale on the first request and fresh on the next. Use source comparison
        for the rejection, not the test alone as target contract authority.
