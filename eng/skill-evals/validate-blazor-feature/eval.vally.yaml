name: validate-blazor-feature
description: A/B eval for the validate-blazor-feature skill (validating Blazor features with the Components samples).
type: capability

defaults:
  runs: 5
  timeout: 600s
  model: claude-opus-4.6
  judge_model: claude-opus-4.6

scoring:
  weights:
    output-matches: 0.3
    prompt: 0.7
  threshold: 0.6

stimuli:
  - name: place-a-webassembly-test-page
    prompt: |
      I'm working in dotnet/aspnetcore and want to manually try out a new interactive component that
      should run in the browser via WebAssembly, using the Blazor sample apps in src/Components before I
      write any E2E tests. Which sample should I use, and exactly where do I put the new page and how do
      I make it run on WebAssembly?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)\.client'
      - type: output-matches
        config:
          pattern: '(?i)@rendermode'
      - type: prompt
    rubric:
      - "Directs the user to one of the in-repo Blazor Web App samples (BlazorWebAppPerPage or BlazorWebAppGlobal), not a freshly scaffolded app"
      - "Says a WebAssembly (or Auto) component must live in the .Client project so it compiles into the client assembly"
      - "Shows setting the render mode to InteractiveWebAssembly (or InteractiveAuto), e.g. an @rendermode directive, and that the page needs an @page route"
      - "Does not claim a component placed only in the server host project can run on WebAssembly"

  - name: switch-global-app-to-server-only
    prompt: |
      I have the global-interactivity Blazor sample running (BlazorWebAppGlobal) and I want the whole app
      to use interactive Server only instead of Auto, so I can validate a server-circuit behavior. What's
      the minimal change?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)InteractiveServer'
      - type: output-matches
        config:
          pattern: '(?i)(App\.razor|Routes|HeadOutlet|rendermode)'
      - type: prompt
    rubric:
      - "Explains that a global app sets the render mode in the host App.razor on the Routes (and HeadOutlet) components"
      - "Says to change the single @rendermode value from InteractiveAuto to InteractiveServer"
      - "Treats it as a one-line/one-value change rather than restructuring the project or moving files"
      - "Does not tell the user to remove the .Client project or change service registrations to accomplish this"

  - name: confirm-actually-interactive
    prompt: |
      I added an interactive counter to a Blazor sample and the page renders with the button and the
      count showing. How do I actually confirm it is interactive and not just statically server-rendered?
      I have a browser automation tool available.
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(click|interact)'
      - type: output-matches
        config:
          pattern: '(?i)(static|SSR|circuit|websocket|_blazor|webassembly)'
      - type: prompt
    rubric:
      - "Says that rendered markup alone does not prove interactivity because static SSR emits the same HTML"
      - "Requires a behavioral check: interact (click the button) and assert the displayed state actually changes (e.g. the count increments)"
      - "Mentions confirming the runtime attached, e.g. an interactive Server circuit's _blazor WebSocket connecting, or the WebAssembly runtime booting"
      - "For WebAssembly, notes the runtime boots asynchronously so you must wait for it before interacting"

  - name: scope-console-error-checks
    prompt: |
      While validating a Blazor sample in the browser I dumped all the console messages and there are a
      bunch of red errors about a connection being refused and SignalR negotiation failing, but they
      point at a localhost port that isn't the app I'm currently testing. Are these real problems, and
      how should I be checking the console?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(stopped|previous|other port|not.*running|refused)'
      - type: prompt
    rubric:
      - "Identifies the errors as stale/false positives from a previously-stopped server on a different port, not a defect in the app under test"
      - "Advises scoping console checks to the current page rather than dumping the whole session history"
      - "Tells the user to filter for errors whose URL belongs to the app/port currently under test and ignore other-port noise"
      - "Does not tell the user to start debugging the app under test because of those unrelated errors"

  - name: debug-button-does-nothing
    prompt: |
      I'm testing a Blazor feature in one of the src/Components sample apps. The page loads fine and the
      button shows, but clicking it does nothing: the value on screen never changes. What are the most
      likely causes and how do I fix it?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(rendermode|render mode|interactiv)'
      - type: prompt
    rubric:
      - "Identifies that the component is rendering as static SSR, i.e. no interactive render mode is actually applied"
      - "Says to add/verify the @rendermode (per page, or on Routes/HeadOutlet for a global app)"
      - "Considers that a WebAssembly/Auto component must be in the .Client project, otherwise it won't be interactive"
      - "Suggests confirming the framework JS (blazor.web.js) is built and served and checking the browser console, rather than only guessing"

  - name: choose-selenium-for-real-browser-geometry
    prompt: |
      I am fixing a Components regression where a virtualized list sometimes jumps after a resize. The
      production path combines real scroll geometry with ResizeObserver and IntersectionObserver callbacks.
      I plan to add a Selenium scenario for the visible jump. Can I also keep a fast supplemental test in an
      existing .test.ts file by defining scrollHeight/clientHeight with Object.defineProperty, stubbing both
      observers, and invoking their callbacks directly? What should the production change include, and what
      boundary decision should I record before handing the fix off?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(selenium|E2E)'
      - type: output-matches
        config:
          pattern: '(?i)(behavior owner|production producer|final observable|lower-boundary false-pass)'
      - type: prompt
    rubric:
      - "Selects permanent C# Selenium coverage under src/Components/test/E2ETest because the production behavior is owned by real browser geometry, scrolling, and observers"
      - "Rejects the synthetic TypeScript/Jest test as production regression proof, including as supplemental coverage, while allowing it only as a temporary diagnostic outside the production change"
      - "Records all five boundary fields: behavior owner, production producer, final observable, selected permanent surface, and lower-boundary false-pass risk"
      - "Explains that mocked geometry and directly invoked observer callbacks can pass without proving that the browser producer reaches the shipped state"
      - "Requires strict Selenium red/green with the same assertion, the nearest opposite control, and adjacent same-producer controls"

  - name: reject-fast-jest-only-observer-proof
    prompt: |
      Please keep this fix small and fast: add only a Jest test for a ResizeObserver-driven component bug.
      The test can mock ResizeObserver and getBoundingClientRect, and CI should not pay for Selenium. I need
      the production PR ready today. What test plan should I use?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(selenium|E2E)'
      - type: output-matches
        config:
          pattern: '(?i)(block|blocked|not.*Jest|Jest.*not|only regression proof)'
      - type: prompt
    rubric:
      - "Fails closed despite the request for speed and requires a permanent C# Selenium scenario for the browser-owned ResizeObserver behavior"
      - "States that the fix remains blocked while mocked Jest coverage is its only regression proof"
      - "Does not compromise by proposing the Jest test as primary, supplemental, faster, or more precise production coverage"
      - "Allows mocked observer or geometry work only as a temporary diagnostic outside the production change and removes it after Selenium supersedes it"
      - "Requires the identical Selenium assertion to fail without the fix and pass with it, with the nearest opposite control and adjacent same-producer controls"

  - name: allow-pure-typescript-helper-test
    prompt: |
      I extracted a TypeScript helper that parses a comma-separated component option string into a plain
      object. It accepts only a string, returns only strings and booleans, reads no globals, and does not
      touch the DOM, navigation, events, layout, observers, or JS interop. A bug is entirely in its escaping
      rules. Should the permanent regression test use Selenium or a focused TypeScript unit test? For
      comparison, where should behavior stay when a managed service owns it completely and its injected
      service contract exposes every precondition and final observable without involving a browser?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(TypeScript|unit test|pure helper)'
      - type: output-matches
        config:
          pattern: '(?i)(plain input|plain output|browser-independent|no.*fidelity|lower boundary)'
      - type: prompt
    rubric:
      - "Permits focused TypeScript unit coverage because both the helper's preconditions and observable are browser-independent plain inputs and outputs"
      - "Explains that Selenium adds no fidelity for a parsing and escaping defect wholly owned by the pure helper"
      - "Keeps the exception narrow and would disqualify it if the test mocked browser observers, layout APIs, geometry, navigation, events, or browser-dependent interop"
      - "Does not reflexively require Selenium merely because the helper is written in TypeScript or used by Components"
      - "Still records a coherent five-field boundary decision with the pure helper as owner and the focused unit suite as the selected surface"
      - "Keeps the fully owned and observable managed-service behavior at its faithful managed lower boundary rather than requiring Selenium"

  - name: keep-selenium-with-minimal-javascript-step
    prompt: |
      I am validating focus and selection restoration after a component rerender. C# Selenium can drive the
      interaction and assert the user-visible edited value, but WebDriver has no precise API for setting an
      input's selection range to exact UTF-16 offsets. May I use JavaScript, and if so how should the permanent
      test be divided?
    graders:
      - type: output-matches
        config:
          pattern: '(?i)(IJavaScriptExecutor|setSelectionRange|JavaScript)'
      - type: output-matches
        config:
          pattern: '(?i)(C#|Selenium).*(final|assert|orchestrat)|(?:final|assert|orchestrat).*(C#|Selenium)'
      - type: prompt
    rubric:
      - "Keeps the permanent scenario in C# Selenium rather than moving it to a JavaScript or TypeScript unit test"
      - "Names the exact limitation: WebDriver cannot precisely set the input selection range to exact UTF-16 offsets"
      - "Allows only a minimal existing helper or IJavaScriptExecutor snippet for the setSelectionRange step"
      - "Keeps navigation, rerender orchestration, and the final user-visible edited-value assertion in C# Selenium"
      - "Does not generalize the exception into permission for JavaScript-owned scenario orchestration, mocked selection state, or a JavaScript final assertion"
