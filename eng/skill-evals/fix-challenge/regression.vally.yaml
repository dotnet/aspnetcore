    rubric:
      - "Overall response matches this expected outcome: A high-confidence review that blocks the still-incomplete PR implementation while allowing the separate candidate to become production-proven because authoritative intent, reproduced mechanism, exact scenarios, real producer paths, varied stress, and exact CI configurations all align."
