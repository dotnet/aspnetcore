      Review an ASP.NET Core pooled-resource fix. Accepted issue criteria and a maintainer clarification require every lease to be returned exactly once on normal completion, cancellation, and producer fault. Retained traces show a double return on cancellation. The current PR fixes cancellation but still leaks the lease on producer fault. A separate candidate not present in the PR centralizes release in one ownership exit. The identical real-path assertions fail at the frozen PR head for cancellation and fault, pass with the candidate, and a varied normal/cancel/fault/dispose matrix plus neighboring tests pass on the exact CI configurations. Keep the review local.
