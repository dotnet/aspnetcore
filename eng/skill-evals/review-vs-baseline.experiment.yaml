name: review-vs-baseline
evals:
  - review-pull-request/eval.vally.yaml

# The reviewer treatment includes its skill and the profiles referenced by it.
vary:
  - /environment/skills
  - /environment/files

baseline: baseline
variants:
  baseline:
    environment:
      skills: []
  skilled:
    environment:
      skills:
        - ../../.github/skills/review-pull-request
      files:
        - { src: ../../docs/CrossCuttingGuidance.md, dest: docs/CrossCuttingGuidance.md }
        - { src: ../../docs/BlazorComponentsGuidance.md, dest: docs/BlazorComponentsGuidance.md }
        - { src: ../../.github/agents/review-candidate-verifier.agent.md, dest: .github/agents/review-candidate-verifier.agent.md }
        - { src: ../../.github/agents/review-guide-worker.agent.md, dest: .github/agents/review-guide-worker.agent.md }
