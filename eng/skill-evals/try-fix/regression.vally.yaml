# Canonical Vally evaluation suite.
# Validated with @microsoft/vally-cli@0.13.0.
name: try-fix
description: "Vally evals for the try-fix skill."
type: capability
defaults:
  runs: 5
  timeout: 1200s
  model: gpt-5.6-sol
  judge_model: claude-opus-5
environment:
  files:
    - src: "../../../.github/instructions"
      dest: ".github/instructions"
    - src: "../../../eng/common/AGENTS.md"
      dest: "eng/common/AGENTS.md"
    - src: "../../../.editorconfig"
      dest: ".editorconfig"
    - src: "../../../.gitignore"
      dest: ".gitignore"
    - src: "../../../.globalconfig"
      dest: ".globalconfig"
    - src: "../../../Directory.Build.props"
      dest: "Directory.Build.props"
    - src: "../../../Directory.Build.targets"
      dest: "Directory.Build.targets"
    - src: "../../../global.json"
      dest: "global.json"
  commands:
    - git init --quiet
    - git clean -fdX
    - git clean -fd -- eng/skill-evals/fix-challenge eng/skill-evals/try-fix
    - git remote add origin https://github.com/dotnet/aspnetcore.git
    - git remote set-url --push origin no-push://dotnet/aspnetcore
    - git add .
    - git -c user.name=Vally -c user.email=vally@example.invalid commit --quiet --allow-empty -m "Vally fixture"
scoring:
  weights:
    prompt: 1.0
  threshold: 0.7
stimuli:
  - name: "eval-01-browser-lifecycle-assertion-fidelity"
    prompt: |-
      Invoke the try-fix skill for this task.

      In an isolated dotnet/aspnetcore worktree, empirically validate a browser list bug. The supplied assertion contract opens at item 400, increases only item 399's height, confirms item 400 stays pinned, then presses End and expects the last item. Run the identical assertion against frozen head and one candidate in both requested runtime variants for three repetitions. Do not post or push.
    tags:
      eval_id: "1"
      skill_name: "try-fix"
      mechanism: "browser-lifecycle-assertion-fidelity"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
      area: "Components/Virtualization"
      score_family: "assertion-fidelity"
      tier: "train"
      provenance_kind: "historical"
      provenance_source: "dotnet/aspnetcore#68114"
      discovery_mode: "verification"
      controls_positive: "0,1,2,5,6,7"
      controls_negative: "3,4,8"
      forbidden_prompt_terms: "[]"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A structured empirical candidate that preserves the exact focused stimulus, reaches the End assertion, reports every execution, and does not substitute a global variable-height or all-items layout change."
      - "The candidate states the product oracle and its source confidence before proposing a fix."
      - "The assertion plan lists setup, control, trigger, expected assertion, allowed perturbations, runtime variants, and repetitions."
      - "Only the specified adjacent item is resized before the boundary-key trigger."
      - "The test does not substitute a global layout-mode or all-items height change."
      - "A failure before the End trigger is classified as a scenario mismatch or separate finding rather than proof of the requested claim."
      - "Frozen-head and candidate runs use the identical behavioral assertion."
      - "The execution matrix contains one result for every requested runtime variant and repetition."
      - "The response distinguishes finding proof, scenario proof, candidate proof, and assertion fidelity."
      - "No GitHub state or parent worktree is modified."
  - name: "eval-02-timeout-policy-oracle"
    prompt: |-
      Invoke the try-fix skill for this task.

      In empirical mode, evaluate an ASP.NET Core worker-test candidate that changes an observer timeout from two seconds to ten seconds. The only support for allowing longer work is the patch author's hypothesis. A proposed diagnostic gates healthy work for three seconds, so it fails under the old timeout and passes under the candidate. Use an isolated worktree and keep all changes local.
    tags:
      eval_id: "2"
      skill_name: "try-fix"
      mechanism: "timeout-policy-oracle"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
      area: "Testing/Infrastructure"
      score_family: "proof-calibration"
      tier: "train"
      provenance_kind: "historical"
      provenance_source: "timeout-policy calibration"
      discovery_mode: "verification"
      controls_positive: "0,1,2,3,4"
      controls_negative: "5,6"
      forbidden_prompt_terms: "[]"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A structured candidate that can run the synthetic diagnostic while refusing to turn a candidate-shaped threshold probe into authoritative scenario proof or a production-proven implementation."
      - "The output distinguishes accepted behavior from patch intent and the proposed historical cause."
      - "Oracle fidelity is hypothesis unless stronger independent authority is found."
      - "The assertion plan states the independent authority for expecting three-second work to succeed."
      - "If no independent authority exists, the assertion disposition is diagnostic-only."
      - "Scenario fidelity is synthetic rather than exact."
      - "A green candidate is not production-proven without a varied stress matrix and real producer validation."
      - "The response says the experiment proves the timeout-policy difference but not the original failure mechanism."
  - name: "eval-03-compatibility-oracle"
    prompt: |-
      Invoke the try-fix skill for this task.

      In candidate-review mode, assess restoring a removed legacy serializer alias. The only claim that old payloads are unsupported comes from the current patch description. A proposed regression test sends the old property and passes only with the alias restored. Do not edit the checkout.
    tags:
      eval_id: "3"
      skill_name: "try-fix"
      mechanism: "compatibility-oracle"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
      area: "MVC/Serialization"
      score_family: "oracle-authority"
      tier: "train"
      provenance_kind: "synthetic"
      provenance_source: "legacy serializer alias scenario"
      discovery_mode: "verification"
      controls_positive: "0,1,4"
      controls_negative: "2,3"
      forbidden_prompt_terms: "[]"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A read-only candidate that explains the structural compatibility effect but does not treat its own old-payload test as an authoritative compatibility contract."
      - "The candidate identifies whether the old-payload expectation has documentation, accepted criteria, maintainer context, or only patch-author rationale."
      - "The proposed test states why its expected result is required independently of restoring the alias."
      - "Without stronger authority, the candidate labels the compatibility requirement unsupported or oracle-blocked."
      - "The candidate does not claim Pass in candidate-review mode."
      - "The recommendation is calibrated as a compatibility question or defensive option rather than a proven required change."
  - name: "eval-04-timeout-cleanup-build-bypass"
    prompt: |-
      Invoke the try-fix skill for this task.

      Use try-fix in empirical mode to calibrate this retained result without editing or rerunning it. Untouched head fails the independently justified timeout assertion; the same assertion passes with one candidate while a frontend asset-generation target is disabled. Baseline/source evidence shows that target only emits static browser assets and is not read by the focused task-lifecycle test. Two mechanism-derived variants pass: ordinary inner completion before timeout, and observer timeout followed by deterministic inner-task cancellation and exception observation. The standard build and exact CI path were not run. State what is proven, why the variants add evidence beyond repetition, the regression-assertion disposition, the result for a production-readiness request, and the highest honest candidate label.
    tags:
      eval_id: "4"
      skill_name: "try-fix"
      mechanism: "timeout-cleanup-build-bypass"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
      area: "Testing/Infrastructure"
      score_family: "cleanup-proof-boundary"
      tier: "train"
      provenance_kind: "historical"
      provenance_source: "background-worker timeout calibration"
      discovery_mode: "verification"
      controls_positive: "0,1,2,3,4,5,6,7"
      controls_negative: "8"
      forbidden_prompt_terms: "[]"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A calibrated production-readiness result of Blocked with a targeted-proven candidate: it credits behavioral red/green and distinct cleanup variants, preserves the required regression assertion, records why the build bypass is irrelevant to the focused behavior while still limiting build fidelity, and refuses production-ready or cross-configuration wording."
      - "The behavioral red/green and implementation candidate are credited while remaining separate from the build-bypass limitation."
      - "The build-property override is recorded and shown irrelevant to the focused behavior before use."
      - "The proof is capped at targeted-proven while the standard build or exact CI path remains unvalidated."
      - "The ordinary-completion and timeout-cancellation variants are recognized as distinct mechanism coverage rather than repeated identical passes."
      - "The test inspects inner task state after timeout and deterministically releases or cancels outstanding work."
      - "Exceptions from timed-out inner work are observed so they cannot leak into later tests."
      - "The regression assertion is classified required-regression because it independently proves the defect and correction."
      - "The production-readiness Result is Blocked while the candidate label remains targeted-proven."
      - "The final wording preserves configuration and scenario limits and does not claim production-ready."
  - name: "eval-05-pooled-resource-strong-proof"
    prompt: |-
      Invoke the try-fix skill for this task.

      In an isolated ASP.NET Core worktree, evaluate one pooled-resource candidate. Accepted criteria require exactly one lease return on normal completion, cancellation, producer fault, and disposal. Frozen-head assertions reproduce a cancellation double-return and a producer-fault leak through the real owner path. The candidate unifies ownership exit, and the identical assertions plus a varied lifecycle matrix pass on every required configuration.
    tags:
      eval_id: "5"
      skill_name: "try-fix"
      mechanism: "pooled-resource-strong-proof"
      executor_model: "gpt-5.6-sol"
