# This Vally specification is the exhaustive governance regression source of truth.
# Validated with @microsoft/vally-cli@0.13.0.
# Run vally lint --strict and the repository C# validate-agent command after changes.
name: blazor-component-readiness
description: "Capability and governance regressions for the explicit Blazor component-readiness agent."
type: capability
defaults:
  runs: 5
  timeout: 1200s
  model: gpt-5.6-sol
  judge_model: claude-opus-5
scoring:
  weights:
    prompt: 1.0
  threshold: 0.7
stimuli:
  - name: "eval-01-artifact-provenance"
    prompt: |-
      Timebox one published Blazor grid-component review against the bundled public rubric. The release workflow says it signs packages and a separate workflow creates an SBOM. Produce the readiness scorecard and maintainer handoff without modifying GitHub. Stop when the timebox expires.
    tags:
      eval_id: "1"
      area: "licensing-and-provenance"
      score_family: "artifact-truth"
      tier: "train"
      requirement_prefixes: "LP,PI"
      provenance_kind: "synthetic-transfer"
      provenance_source: "published-package provenance case"
      positive_controls: "1,2,3"
      negative_controls: "0,4,5"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A one-component, read-only scorecard that verifies the released artifact, distinguishes signing layers, and requires SBOM and provenance evidence to bind to the published package."
      - "The review remains scoped to the single grid component rather than expanding to the generated component catalog."
      - "The released package is inspected independently of workflow configuration."
      - "Strong-name, Authenticode, NuGet author, and repository signatures are scored separately."
      - "SBOM acceptance requires binding to the exact final signed NuGet package digest."
      - "Missing private legal or retention evidence is not mislabeled as a product defect."
      - "No repository or GitHub write operation is performed."
      - "When the timebox expires, remaining applicable rows are not tested with bounded reviewer follow-ups rather than silently extending the review."
  - name: "eval-02-accessibility-layers"
    prompt: |-
      Review a Blazor tree control. Source shows keyboard handlers and aria-expanded, but the maintainer has not provided an automated accessibility scan, full assessment, screen-reader, forced-colors, or WCAG report. Tell me whether it meets the accessibility quality bar and what evidence is missing.
    tags:
      eval_id: "2"
      area: "accessibility"
      score_family: "evidence-layering"
      tier: "train"
      requirement_prefixes: "A11Y"
      provenance_kind: "synthetic-transfer"
      provenance_source: "tree accessibility layering case"
      positive_controls: "0,2,4"
      negative_controls: "1,3"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A layered accessibility assessment that records positive source evidence, identifies any deterministic behavior failures separately, and does not infer formal conformance."
      - "ARIA and keyboard implementation are classified as source evidence only."
      - "The output does not claim WCAG conformance."
      - "Automated scan, full assessment, screen-reader, and forced-colors evidence are requested separately without requiring a specific branded tool."
      - "Missing maintainer evidence is scored maintainer evidence required rather than defect unless concrete behavior fails."
      - "Browser and assistive-technology evidence are not treated as interchangeable."
  - name: "eval-03-generated-control-scope"
    prompt: |-
      Review one generated Blazor selection control. Keep it bounded, but include repository-wide package and release requirements. Several wrappers are generated and share runtime code.
    tags:
      eval_id: "3"
      area: "blazor-engineering"
      score_family: "scope-control"
      tier: "train"
      requirement_prefixes: "BEQ"
      provenance_kind: "synthetic-transfer"
      provenance_source: "generated selection-control scope case"
      positive_controls: "0,1,2,4"
      negative_controls: "3"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A one-control vertical review that applies repository-wide rows once, separates generated output from owning layers, and avoids catalog-wide conclusions."
      - "The component-specific scope remains the selected control."
      - "Core requirement scope is copied from the pinned rubric rather than selected by the report."
      - "Repository-wide evidence is reused only for the same pinned repository SHA and exact package ID/version/digest."
      - "Generated defects are assigned to generator, schema, handwritten partial, or shared runtime where supported."
      - "The result does not generalize one control into catalog-wide readiness."
      - "The report includes a complete scorecard and a concise maintainer handoff."
  - name: "eval-04-security-preconditions"
    prompt: |-
      A component release job executes repository-controlled npm and MSBuild inputs, then obtains signing and publishing authority in the same job. A malicious actor would need repository write access plus release or tag authority, and private environment approval is unknown. Classify this finding for a one-component readiness report.
    tags:
      eval_id: "4"
      area: "security-and-privacy"
      score_family: "threat-calibration"
      tier: "held-out"
      requirement_prefixes: "SEC"
      provenance_kind: "synthetic-transfer"
      provenance_source: "release-pipeline trust-boundary case"
      positive_controls: "0,1,2,4"
      negative_controls: "3"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A bounded supply-chain trust-boundary finding with explicit attacker preconditions, impact, confidence, and unknown compensating controls."
      - "The attacker capability includes repository write access plus release or tag authority."
      - "Private environment approval is recorded as an unknown potential compensating control."
      - "The concern is classified as a package supply-chain trust-boundary issue."
      - "The output does not describe an unconditional remote runtime vulnerability."
      - "The report separates the observable pipeline design from maintainer-owned security-review evidence."
  - name: "eval-05-trim-versus-aot"
    prompt: |-
      A component package does not set IsTrimmable or document an equivalent, but an external package-based standalone WebAssembly app publishes with trimming and trim analysis enabled, loads in a browser, and exercises the component without attributable trim warnings. Score trim configuration, trim behavior, and native AOT separately.
    tags:
      eval_id: "5"
      area: "trimming-and-aot"
      score_family: "runtime-evidence"
      tier: "train"
      requirement_prefixes: "TA"
      provenance_kind: "synthetic-transfer"
      provenance_source: "trim configuration and runtime case"
      positive_controls: "1,3"
      negative_controls: "0,2"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: Trim configuration, package-based runtime evidence, and native AOT are scored as separate requirements."
      - "Missing IsTrimmable or a documented equivalent is a TA-08 configuration or documentation defect."
      - "The package-based trimmed publish and browser exercise are treated as direct behavior evidence."
      - "Native AOT is scored separately and is not inferred from trimming success."
      - "The supported trim and AOT matrix still requires documentation evidence."
  - name: "eval-06-performance-evidence"
    prompt: |-
      The source for a hierarchical component uses virtualization and ShouldRender. No representative item count, circuit-memory measurement, interaction timing, payload measurement, bundle budget, or comparative benchmark was supplied. Complete the performance section without inventing results.
    tags:
      eval_id: "6"
      area: "performance"
      score_family: "evidence-layering"
      tier: "held-out"
      requirement_prefixes: "PERF"
      provenance_kind: "synthetic-transfer"
      provenance_source: "hierarchical-control performance case"
      positive_controls: "1,2,3"
      negative_controls: "0,4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A performance assessment that treats source choices as risk indicators, requests representative targets and measurements, and does not claim the component meets a performance budget."
      - "Virtualization and ShouldRender source are not treated as proof of acceptable performance."
      - "Missing maintainer targets and representative measurements are identified as evidence requests."
      - "Applicable reviewer probes not performed are distinguishable from maintainer-owned records."
      - "Interactive Server and WebAssembly performance concerns are assessed separately."
      - "No unsupported performance defect or pass claim is invented."
  - name: "eval-07-release-immutability"
    prompt: |-
      Review a release pipeline where PR CI builds and tests, but the privileged release stage rebuilds from source before signing. Browser tests are optional, documentation snippets are never compiled, and the release checklist has no requirement IDs. Score CI and release validation.
    tags:
      eval_id: "7"
      area: "ci-and-release"
      score_family: "artifact-truth"
      tier: "train"
      requirement_prefixes: "CI"
      provenance_kind: "synthetic-transfer"
      provenance_source: "immutable release artifact case"
      positive_controls: "1,3,4"
      negative_controls: "0,2"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A release-control assessment that distinguishes PR checks from exact-release evidence, rejects rebuilding after verification, and identifies missing browser, documentation, and requirement revalidation gates."
      - "PR CI success is not treated as evidence for the separately rebuilt release artifact."
      - "The rebuild before signing is identified as breaking immutable artifact handoff."
      - "Optional browser tests are not described as required gates."
      - "Documentation examples require compilation and behavioral validation."
      - "Release revalidation is expected to map to canonical requirement IDs."
  - name: "eval-08-support-evidence"
    prompt: |-
      A component repository has recent commits, public issues, and SECURITY.md. It does not publish supported versions, response targets, patch cadence, EOL timing, named support ownership, release revalidation records, or a process for suspending and restoring supported release status after a readiness regression. Assess support and servicing.
    tags:
      eval_id: "8"
      area: "support-and-lifecycle"
      score_family: "ownership-boundary"
      tier: "held-out"
      requirement_prefixes: "SUP"
      provenance_kind: "synthetic-transfer"
      provenance_source: "active-repository support case"
      positive_controls: "2,3,4"
      negative_controls: "0,1"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A support assessment that recognizes public issue and disclosure channels but requests explicit lifecycle commitments and private operational evidence without inferring them from repository activity."
      - "Recent repository activity is not treated as proof of a support SLA."
      - "SECURITY.md is not treated as proof of emergency servicing capability."
      - "Supported versions, response targets, patch cadence, EOL, and ownership are requested explicitly."
      - "Private servicing and revalidation records are classified as maintainer evidence required."
      - "Observable missing required public policy is separated from missing private operations."
      - "The reviewer holding a recommendation does not self-verify SUP-10; suspension and recovery governance remains maintainer-owned."
  - name: "eval-09-conditional-families"
    prompt: |-
      This is a scorecard-structure question, not a request to score a real package. For a standalone released Blazor UI package that contains no scaffolder and no AI skill, explain the complete report shape, give the template command, and state how the optional scaffolder and AI-skill overlays are handled.
    tags:
      eval_id: "9"
      area: "conditional-requirements"
      score_family: "completeness"
      tier: "train"
      requirement_prefixes: "SCF,AI"
      provenance_kind: "synthetic-control"
      provenance_source: "standalone UI package"
      positive_controls: "0,1,3"
      negative_controls: "2,4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: The complete report contains the 110-ID core and omits both unselected overlays."
      - "No SCF requirement receives a scorecard row because the deliverable has no scaffolder."
      - "No AI requirement receives a scorecard row because the deliverable has no AI skill or plugin."
      - "The report names rubric 1.3.0, scope schema 1, and records that no overlays were selected."
      - "The response explains how --overlay scaffolder or --overlay ai-skill would opt in the relevant six IDs."
      - "The review does not expand into evaluating unrelated scaffolders or AI assets."
  - name: "eval-10-cross-area-adjudication"
    prompt: |-
      Review the one control described by the supplied evidence fixture. Use only that bounded evidence, distinguish artifact snapshots from current source, and do not invent attestations or test results.

      Read eval-input/evidence.md. Produce a concise cross-area adjudication containing one explicitly identified representative requirement row from every core requirement prefix. Then explain the deterministic core-completeness gate and why the scaffolder and AI-skill overlays are omitted for this fixture.
    tags:
      eval_id: "10"
      area: "all-areas"
      score_family: "completeness"
      tier: "held-out"
      requirement_prefixes: "LP,PI,SEC,A11Y,BEQ,TA,PERF,CI,SUP,SCF,AI"
      provenance_kind: "synthetic-control"
      provenance_source: "mixed-evidence final report"
      positive_controls: "0,2,3,4,5"
      negative_controls: "1,6"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    environment:
      files:
        - src: "fixtures/mixed-evidence-component.md"
          dest: "eval-input/evidence.md"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A concise, evidence-backed cross-area adjudication plus an accurate explanation of the 110-row core structural-completeness gate."
      - "Exactly one representative canonical requirement is explicitly identified for each core prefix: LP, PI, SEC, A11Y, BEQ, TA, PERF, CI, and SUP."
      - "Only the exact case-sensitive tokens verified, defect, maintainer evidence required, not tested, and not applicable are used; N/A and status aliases are rejected."
      - "Published-package evidence is distinguished from current source and separately rebuilt artifacts."
      - "Concrete defects, maintainer-owned evidence gaps, and unperformed reviewer probes are classified separately."
      - "SCF and AI rows are omitted because neither optional overlay was selected for the bounded deliverable."
      - "The response states that the final core report must retain all 110 core IDs exactly once in canonical order and pass the repository C# scorecard validator."
      - "The response explains that structural validation does not prove factual truth."
      - "No attestation, test result, or catalog-wide conclusion is invented."
  - name: "eval-11-bounded-no-defect"
    prompt: |-
      A simple input component has awaited callbacks, deterministic disposal tests, documented Server and WebAssembly support, successful browser probes, correct computed accessibility semantics, and no observed lifecycle failures. Formal WCAG and servicing records are still private. Produce the readiness result without manufacturing defects.
    tags:
      eval_id: "11"
      area: "blazor-and-accessibility"
      score_family: "no-defect-control"
      tier: "held-out"
      requirement_prefixes: "BEQ,A11Y"
      provenance_kind: "synthetic-control"
      provenance_source: "bounded stateless input"
      positive_controls: "0,1,3"
      negative_controls: "2,4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: Verified component behavior remains verified, private attestations remain evidence requests, and the review does not invent lifecycle or accessibility defects merely to produce findings."
      - "Awaited callbacks and demonstrated disposal behavior are recorded as positives."
      - "Successful render-mode browser probes are recorded as direct behavior evidence."
      - "Correct accessibility behavior is not converted into formal WCAG conformance."
      - "Private WCAG and servicing records remain maintainer evidence required."
      - "No unsupported product defect is invented."
  - name: "eval-12-run-feedback-mining"
    prompt: |-
      We just completed a Blazor component-readiness review. Use only these scrubbed run observations; do not search for files:

      - The public metadata-versus-private-attestation status boundary was unclear, and the same ambiguity was recorded in two independent prior runs.
      - Repeating one exact package-provenance claim across 14 scorecard rows was the highest clerical cost.
      - A dynamic child/value reconciliation matrix caught a late-registration failure and appears reusable.
      - One specific child failed in a proprietary source file; that component fact must not enter the repository agent.
      - The scorecard annex materially qualified, but did not reverse, the decision.

      Mine the experience so the repository agent can improve. Produce a shareable, issue-ready workflow retrospective with evidence-backed proposed changes and regression cases, then explain the consent-safe sharing step. Do not rerun the component review, expose proprietary evidence, modify the agent, publish an issue, or share the full session.
    tags:
      eval_id: "12"
      area: "feedback-loop"
      score_family: "workflow-feedback"
      tier: "held-out"
      requirement_prefixes: "BEQ"
      provenance_kind: "synthetic-control"
      provenance_source: "post-run feedback case"
      positive_controls: "0,1,3"
      negative_controls: "2,4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A portable, privacy-aware workflow retrospective that separates component facts from general agent changes and proposes a regression-backed improvement."
      - "The response uses the run-observations structure or portable mining prompt rather than requiring a product-specific slash command."
      - "Proprietary component evidence is excluded or scrubbed from shareable feedback."
      - "A one-off component fact is not added to the public core."
      - "Any proposed core change includes supporting repeated evidence or a public standard plus a regression case."
      - "The response produces or offers an issue-ready sanitized body and directs it to the current repository's issue tracker unless the user selects another public destination."
      - "No issue, artifact, or session link is published without explicit user approval and review of the destination and final body."
      - "A full session link is optional rather than the default, and the feedback remains useful without it."
      - "The skill and component are not modified during feedback mining."
  - name: "eval-13-dynamic-registration"
    prompt: |-
      Plan bounded probes for a Blazor selector whose children register dynamically and whose JS-backed custom element sometimes fails to become interactive on Server. The value may arrive before its option, selected options can be removed, all options can be disabled, and typed numeric arrays round-trip through JS. Distinguish a component defect from a broken probe environment.
    tags:
      eval_id: "13"
      area: "blazor-engineering"
      score_family: "runtime-probe-design"
      tier: "train"
      requirement_prefixes: "BEQ,A11Y"
      provenance_kind: "synthetic-transfer"
      provenance_source: "dynamic registration and custom-element case"
      positive_controls: "0,1,2,4"
      negative_controls: "3,5"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A deterministic matrix covering dynamic child/value reconciliation, custom-element registration/upgrade, keyboard termination, and typed-value round trips."
      - "The matrix covers value-before-item, late item, selected removal, disabled selected item, keyed reorder or replacement, and combined parameter updates."
      - "Circuit connection, asset loading, customElements registration, DOM upgrade, and first interactive callback are distinguished."
      - "All-disabled keyboard navigation includes a termination assertion."
      - "Typed numeric arrays are tested inbound and outbound rather than assuming one direction proves both."
      - "Console/network evidence and a baseline control distinguish probe-environment failure from component failure."
      - "The plan remains bounded to the selected control and does not infer catalog-wide defects."
  - name: "eval-14-rubric-migration-replay"
    prompt: |-
      Replay an existing exact-snapshot Blazor component review from public rubric 1.0.1 onto rubric 1.3.0. The old 122-row report marked all SCF and AI rows not applicable, the component contains neither overlay feature, the old source/package evidence remains available, and public main has advanced. Do not perform a fresh audit. Explain how to migrate the scorecard and report count changes.
    tags:
      eval_id: "14"
      area: "rubric-migration"
      score_family: "evidence-reuse"
      tier: "held-out"
      requirement_prefixes: "SCF,AI"
      provenance_kind: "multi-run-generalization"
      provenance_source: "three exact-snapshot migration replays"
      positive_controls: "0,1,2,4,5"
      negative_controls: "3,6"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A bounded migration replay that preserves old evidence, handles new and changed requirements explicitly, and does not claim current-head readiness."
      - "Stable IDs and canonical wording are diffed before classifications are changed."
      - "Unchanged rows retain their old exact-snapshot evidence and confidence."
      - "The 12 old not-applicable SCF and AI rows are removed because neither overlay is selected; this is a rubric-structure change, not improved product evidence."
      - "The resulting complete report contains all 110 core IDs, copies every scope from rubric 1.3.0 scope schema 1, and selects no overlays."
      - "The 1.2.0 workflow changes and 1.3.0 normative scope metadata do not create new requirement rows or upgrade old product evidence; not applicable remains the exact status token."
      - "The migration delta separates terminology, policy, evidence-driven classification, and new-ID changes."
      - "Aggregate count movement without new product evidence is explicitly explained rather than presented as improved readiness."
      - "The advanced public head is excluded, expensive probes are not rerun, and the final 110-row core report is structurally validated."
  - name: "eval-15-targeted-follow-up"
    prompt: |-
      Using only the supplied synthetic evidence, perform a targeted follow-up without revalidating other core requirements. The prior complete review pinned package 1.2.2/source `aaa111` and classified BEQ-12 and BEQ-15 as defects. Release candidate 1.2.3-rc.1/source `bbb222` claims only those fixes. Its deterministic BEQ-12 probe held an incomplete callback task and confirmed the component operation did not complete until the task was released; a throwing callback was observed by the expected error boundary. Its BEQ-15 probe verified each JS object reference was disposed exactly once, listener removal occurred, and 50 repeated mount/dispose cycles left zero listeners. Treat those records as direct probe evidence for this exercise. Explain the report shape, status deltas, and exact validator commands.
    tags:
      eval_id: "15"
      area: "targeted-review"
      score_family: "targeted-control"
      tier: "train"
      requirement_prefixes: "BEQ"
      provenance_kind: "multi-run-generalization"
      provenance_source: "repeated callback and disposal follow-ups"
      positive_controls: "0,1,2,4"
      negative_controls: "3,5"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A two-ID targeted follow-up tied to the new release candidate and prior exact-snapshot evidence, without implying complete readiness."
      - "The report prominently states that only BEQ-12 and BEQ-15 were revalidated and that unchanged requirements were not reverified."
      - "The scorecard contains exactly BEQ-12 and BEQ-15 in canonical order."
      - "Template emission uses the repository C# scorecard command with --ids BEQ-12,BEQ-15 --emit-template."
      - "Final validation uses the same --ids BEQ-12,BEQ-15 selection."
      - "The output records new evidence, status deltas, and a bounded next action without repeating the complete scorecard."
      - "Targeted structural validation is not presented as a complete adoption or release decision."
  - name: "eval-16-artifact-acquisition-mode"
    prompt: |-
      Plan review mode for a released Blazor input package. NuGet v3 registration confirms version 2.0.0, but the flat-container request fails through the review proxy. A source checkout is available and the reviewer is about to call the control source-only. Explain the bounded acquisition sequence, mode decision, and minimum package checks.
    tags:
      eval_id: "16"
      area: "artifact-acquisition"
      score_family: "mode-consistency"
      tier: "held-out"
      requirement_prefixes: "LP,PI"
      provenance_kind: "multi-run-generalization"
      provenance_source: "seven-control package retrieval inconsistency"
      positive_controls: "0,1,2,4,5"
      negative_controls: "3"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: Transport failure does not redefine the released package as source-only; the reviewer completes the ordered acquisition protocol before selecting mode."
      - "The reviewer records the v3 endpoint/outcome and tries the configured source's NuGet v2 package endpoint."
      - "The original nupkg is hashed before extraction and its package ID, exact version, endpoint, digest, and retrieval state are recorded."
      - "If v2 obtains the exact package, complete mode is used even when RepositoryCommit mapping is absent or invalid."
      - "If exact bytes remain unavailable after both paths, targeted mode is used and applicable selected package rows are not tested rather than not applicable."
      - "Complete mode includes nuspec, license, file/TFM inventory, every assembly's strong-name state, signature layers, SBOM/provenance digest binding, and public source reachability."
      - "A local rebuild or package-manager cache of unknown origin is not substituted for the released artifact."
  - name: "eval-17-shared-artifact-ledger"
    prompt: |-
      Three isolated control reviews share repository SHA abc123 and package Widget.Blazor 3.1.0 with SHA-256 deadbeef. The first review directly inspected package metadata, signatures, every TFM, license, SECURITY.md, and provenance. The second and third are about to independently rescore those repository-wide rows and have already chosen conflicting statuses. Explain how to build immutable source ledgers, a self-contained selected companion, stable evidence references, and structural receipts without laundering component behavior.
    tags:
      eval_id: "17"
      area: "evidence-reuse"
      score_family: "batch-consistency"
      tier: "train"
      requirement_prefixes: "LP,PI,SEC"
      provenance_kind: "multi-run-generalization"
      provenance_source: "three complete same-package control reviews"
      positive_controls: "0,1,2,4"
      negative_controls: "3"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: One immutable repository source ledger is keyed by repository SHA, nuspec package ID/version, and nupkg digest, embedded completely in each self-contained companion, and selected by full EV1 IDs."
      - "Every selected record is proven to be a member of the recomputed embedded source ledger; an arbitrary source hash or copied record is rejected."
      - "There is no authored imported/direct/rechecked label. A changed observation is a new immutable identity-bearing record and may structurally supersede compatible prior evidence."
      - "Different package versions, digests, source SHAs, or release candidates are not merged."
      - "Component-specific runtime, accessibility, and performance evidence remains in an exact-component ledger and cannot cross controls."
      - "Stable scorecard/tracker validation requires an exact assessment block, selected-evidence projection, evidence companion, and schema-3 receipt binding."
      - "Legacy E-### reports require explicit legacy mode and cannot donate cross-report evidence."
      - "The shared ledger reduces duplicate scoring but does not imply one control proves catalog readiness."
  - name: "eval-18-targeting-and-status-boundaries"
    prompt: |-
      Prepare a targeted review for a publicly listed text input whose exact package bytes remain unavailable after both NuGet paths. The exact nuspec cannot be inspected; a private servicing attestation is unavailable; a browser probe was blocked by a missing local prerequisite; source contains plausible aria attributes; and Auto mode is explicitly unsupported and unclaimed. Select a starter scope and classify these evidence states without claiming complete readiness.
    tags:
      eval_id: "18"
      area: "targeted-review"
      score_family: "classification-consistency"
      tier: "held-out"
      requirement_prefixes: "LP,PI,A11Y,BEQ,SUP"
      provenance_kind: "multi-run-generalization"
      provenance_source: "seven-control status and targeted-selection divergence"
      positive_controls: "0,1,2,3,5"
      negative_controls: "4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A clearly targeted text-input review uses a documented starter profile, records ID additions/removals, and makes no complete-readiness claim."
      - "The distributed-package supplement is considered because the package is listed but exact bytes are unavailable."
      - "Blocked direct package and browser checks are not tested, not not applicable or defects."
      - "The inaccessible private servicing attestation is maintainer evidence required."
      - "Plausible source ARIA may verify only an exact source-structure property; computed browser semantics and conformance remain unverified."
      - "Explicitly unsupported, unclaimed, safe Auto behavior can be not applicable."
      - "The report records the prerequisite blocker and a bounded next probe."
  - name: "eval-19-preflight-and-receipt"
    prompt: |-
      A Blazor component pilot is about to restore a large repository and install browsers. The documented route may be stale and no one has confirmed that the target element renders. Describe the probe preflight and the final scorecard validation evidence that should be retained. The review is targeted to BEQ-06 and A11Y-08.
    tags:
      eval_id: "19"
      area: "probe-and-validation"
      score_family: "operational-reliability"
      tier: "train"
      requirement_prefixes: "A11Y,BEQ"
      provenance_kind: "multi-run-generalization"
      provenance_source: "five pilot prerequisite and validator-receipt cases"
      positive_controls: "0,1,3,4"
      negative_controls: "2,5"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A cheap smoke gate precedes expensive setup and a machine-readable structural receipt replaces an unsupported narrative PASS."
      - "Preflight verifies documented tools/prerequisites, route/assets, host startup, one rendered target, and one critical selector before expansion."
      - "A stale route, missing prerequisite, or absent test asset is recorded as a probe blocker unless tied directly to the released component."
      - "Validation uses the same targeted ID selection and describes the result as structural validation passed."
      - "The receipt includes rubric version, targeted selection, canonical/valid row counts, UTC timestamp, and report SHA-256."
      - "The report states that structural validation proves neither factual evidence nor classification quality and that targeted validation is not complete readiness."
      - "No expensive selector suite is expanded after the smoke gate fails."
  - name: "eval-20-evidence-only-tracker-result"
    prompt: |-
      A complete Blazor component review has already produced a structurally validated 110-row report against the bundled rubric. The user also supplied an organization-specific readiness DOCX, but only a category summary was available and no requirement-level crosswalk or drift reconciliation was performed. Draft the evaluation-result shape for a local tracker draft. Lead with a concise "Areas we believe need to be fixed" summary derived only from canonical defect rows, invite feedback about false positives or unhelpful content, and put the unchanged complete assessment and evidence ledger under "Full report" at the bottom. Include all positive and negative classifications and direct evidence, but do not add remediation guidance, ranked priorities, a verdict, acceptance gates, or next steps.
    tags:
      eval_id: "20"
      area: "reporting-and-provenance"
      score_family: "evidence-only-output"
      tier: "held-out"
      requirement_prefixes: "LP,PI,SEC,A11Y,BEQ,TA,PERF,CI,SUP"
      provenance_kind: "multi-model-consensus"
      provenance_source: "four-model review of an evidence-only tracker draft"
      positive_controls: "0,2,3,4,6,7"
      negative_controls: "1,5,8"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A tracker draft leads with an unranked evidence-backed summary of areas believed to need fixes, invites corrective feedback, and preserves the complete canonical assessment at the bottom."
      - "The top summary groups every canonical defect ID exactly once, cites evidence, and does not present maintainer-evidence-required or not-tested rows as fixes."
      - "The proposed Full report section requires all 110 canonical IDs, requirements, scopes, statuses, and evidence references to remain represented exactly once."
      - "The output attributes requirements to the independently maintained bundled rubric and explicitly avoids claiming a row-level DOCX mapping."
      - "Canonical rubric statuses remain visible; any cautious audience-facing labels are shown only as aliases."
      - "The evidence ledger retains sanitized public reproduction anchors such as paths, commands, run IDs, artifact digests, and probe descriptions."
      - "The output includes a clear request to report false positives, missing context, or unhelpful content."
      - "The output excludes ranked priorities, remediation direction, maintainer actions, reviewer follow-ups, verdicts, acceptance gates, and next-step requests."
      - "The AI-review and structural-validation limitations remain explicit."
      - "No project item, issue, repository, or other external system is modified without explicit authorization."
  - name: "eval-21-stable-evidence-integrity"
    prompt: |-
      Two readiness reports both use local anchor E-008 for different claims. A proposed migration copies one record beside a claimed source-ledger hash, changes Tree to Radio in the report scope, and validates without an explicit evidence mode. Explain the fail-closed stable workflow, receipt verification boundary, and historical compatibility behavior.
    tags:
      eval_id: "21"
      area: "evidence-integrity"
      score_family: "stable-evidence-integrity"
      tier: "held-out"
      requirement_prefixes: "LP,PI,BEQ,A11Y"
      provenance_kind: "multi-model-consensus"
      provenance_source: "immutable evidence ledger architecture review"
      positive_controls: "0,1,2,3,5,6"
      negative_controls: "4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: Local E-008 anchors remain schema-2 report-local identifiers; new reports use full content-addressed EV1 IDs from immutable canonical source ledgers."
      - "The companion embeds complete canonical source-ledger bytes, recomputes each digest and record ID, and proves every selected ID is a member."
      - "Released-package repository reuse requires exact repository commit plus nuspec ID/version and nupkg digest; source-only repository and component evidence additionally require exact component ID."
      - "The report and tracker assessment block and selected-evidence projection must match the companion field-for-field, so Tree-to-Radio rebinding fails."
      - "Validation requires exactly one of --evidence-bundle or --legacy-evidence; omission and mixed-mode anchors fail."
      - "A publishable stable result requires a schema-3 receipt and later receipt validation against the exact historical checklist and selected overlays."
      - "The unsigned validator hash is self-reported metadata; an archived binary can establish byte correspondence only, not producer execution or authenticity."
      - "Historical schema-2 receipts retain exact bytes and limited structural revalidation wording without claiming schema-3 evidence membership or overlay provenance."
      - "No status voting, contradiction engine, factual-proof claim, or cross-control component reuse is introduced."
  - name: "eval-22-shared-projection-and-provenance"
    prompt: |-
      Four isolated Blazor control reports share one exact repository/package foundation. A child report copied the shared statuses and evidence anchors but replaced the canonical maintainer actions and reviewer follow-ups with local text. Another report still cites the prior component-ledger and evidence-bundle SHA-256 values after regeneration, while a third declares a live target-manifest digest outside the evidence bundle. Explain the fail-closed artifacts and validator commands that prevent these defects without discarding unselected component-ledger history.
    tags:
      eval_id: "22"
      area: "reporting-and-provenance"
      score_family: "cross-report-integrity"
      tier: "held-out"
      requirement_prefixes: "LP,PI,SEC,CI,SUP"
      provenance_kind: "multi-run-generalization"
      provenance_source: "four same-foundation control reports"
      positive_controls: "0,1,2,3,5"
      negative_controls: "4,6"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A semantic */shared-row-projection/v1 envelope binds every repository-wide source-report field and declared artifact digests are resolved against live canonical inputs."
      - "The shared-row projection is bound to the exact repository source-ledger digest and contains every represented repository-wide requirement."
      - "Source validation compares requirement, scope, status, evidence anchors, maintainer action, and reviewer follow-up exactly rather than checking only status and evidence."
      - "Tracker validation compares every repository-wide row it presents and rejects a partial shared import."
      - "Scorecard receipt generation includes the shared-row projection in the closed validation-input manifest, and later receipt validation requires the same projection bytes."
      - "Any declared 64-lowercase-hex SHA-256 in the source report or tracker must resolve to a supplied live canonical input; stale component-ledger, bundle, or report digests fail."
      - "Additional declared artifacts such as a target manifest use repeated --provenance-input options; schema-3 receipts bind their exact bytes and argument order, and revalidation requires the same inputs."
      - "Complete component ledgers may retain unselected historical records, while every selected record remains cited by the current assessment."
      - "Structural and provenance binding still do not establish factual evidence or classification quality."
  - name: "eval-23-architecture-portability"
    prompt: |-
      Plan a bounded readiness review for the clearly fictional `Example.Components.Blazor.DateSelector` 4.2.0 package. Its synthetic evidence describes a handwritten standalone date selector in a dedicated public repository, Apache-2.0 licensing, public NuGet distribution, and no generator or shared component runtime. No commercial feed, private release service, or paid support program is claimed. Unrelated components can instead use generated wrappers, shared runtimes, private feeds, commercial release machinery, and support attestations. Apply the same acquisition, rubric, and status boundaries without importing architecture assumptions or evidence from unrelated components.
    tags:
      eval_id: "23"
      area: "scope-and-portability"
      score_family: "architecture-portability"
      tier: "held-out"
      requirement_prefixes: "LP,PI,SEC,BEQ,CI,SUP"
      provenance_kind: "synthetic-control"
      provenance_source: "unrelated handwritten standalone package"
      positive_controls: "0,1,2,3,5"
      negative_controls: "4,6,7"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: The review derives architecture, acquisition, release, and governance facts only from the bounded standalone package."
      - "The target remains one handwritten standalone date selector; generated ownership and a shared component runtime are not assumed."
      - "Artifact acquisition uses the target's configured public source and binds the exact package ID, version, digest, and repository snapshot rather than borrowing another suite's feed or package records."
      - "The same bundled core, applicable overlays, exact status vocabulary, and evidence hierarchy apply without changing the rubric for the new architecture."
      - "Open-source release evidence is evaluated as observed; absent commercial release machinery or a paid support program is not invented or treated as a defect merely because unrelated components have them."
      - "No source ledger, component evidence, support attestation, release record, or classification from an identity-mismatched component, repository, or package is reused."
      - "Unknown support or governance claims remain bounded evidence requests, and unperformed applicable probes remain not tested rather than inferred from unrelated components."
      - "A response that assumes generated wrappers, a shared runtime, private feeds, commercial release machinery, or unrelated-component evidence fails this portability case."
      - "The plan remains read-only and does not expand into sibling packages or a component catalog."
  - name: "eval-24-report-correction-preservation"
    prompt: |-
      Correct the prior exact-snapshot readiness report using only the supplied fixture. The maintainer disputes the BEQ-02 documentation finding and supplied attributable product documentation. Produce the correction plan and revised-row delta without rerunning the control or replacing the tracker.

      Read eval-input/report-correction.md. Explain the deterministic revision validation command and every preservation boundary that applies.
    tags:
      eval_id: "24"
      area: "reporting-and-provenance"
      score_family: "revision-preservation"
      tier: "train"
      requirement_prefixes: "A11Y,BEQ"
      provenance_kind: "multi-run-generalization"
      provenance_source: "destructive four-control report replacement incident"
      positive_controls: "0,1,2,3,5,6"
      negative_controls: "4"
      executor_model: "gpt-5.6-sol"
      expected_runs: "5"
    environment:
      files:
        - src: "fixtures/report-correction.md"
          dest: "eval-input/report-correction.md"
    graders:
      - type: prompt
        config:
          threshold: 0.7
    rubric:
      - "Overall response matches this expected outcome: A surgical BEQ-02 correction preserves the exact assessment, unrelated scorecard rows, retained runtime evidence, and prior maintainer feedback."
      - "Only BEQ-02 is declared changed; BEQ-12 and A11Y-08 remain field-for-field unchanged and are explicitly not reverified."
      - "BEQ-02 changes only after the supplied documentation is checked for provenance, authority, currency, applicability, and component alignment; its revised evidence records that basis."
      - "The prior callback runtime probe, accessibility runtime probe, evidence anchors or artifact references, and maintainer issue link remain intact."
      - "The tracker is revised in place rather than replaced by a fresh confidential report or a full rerun."
      - "The correction delta names the prior and revised BEQ-02 status, the new evidence, and the unchanged exact package, source commit, component, and rubric."
      - "The response runs revision --previous <prior-report-or-tracker.md> --changed-ids BEQ-02 <revised-report-or-tracker.md>, then runs the normal scorecard and tracker validators."
      - "The response does not silently remove feedback, downgrade higher-precedence evidence, change undeclared rows, or claim that structural validation proves factual correctness."
