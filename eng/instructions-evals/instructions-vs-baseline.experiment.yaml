name: instructions-vs-baseline

# Controlled A/B for the repository-wide public-API governance gate in
# .github/copilot-instructions.md. The same three governance stimuli run with the
# instructions absent (baseline) and with .github/copilot-instructions.md overlaid into the
# agent workspace (current). Only /environment/files varies. Copilot auto-loads
# .github/copilot-instructions.md from its working directory, so overlaying the file is what
# turns the guidance on for the `current` variant.
#
# This is the instructions-file analogue of eng/skill-evals/skills-vs-baseline.experiment.yaml.
# It is kept in its own eng/instructions-evals/ tree on purpose: the skills experiment
# globs eng/skill-evals/*/eval.vally.yaml and assumes each match maps to a
# .github/skills/<name> directory. The repo-wide instructions file is not a skill, so it
# must not live under eng/skill-evals/.
#
# THE EVAL IS VARIANT-NEUTRAL: copilot-instructions/eval.vally.yaml has no top-level
# environment. This experiment is the ONLY place the environment is injected — `baseline`
# sets /environment/files to [] (instructions off) and `current` overlays the instructions
# file (instructions on). The eval must stay neutral: Vally merges file environments by
# CONCATENATION, so a baked overlay in the eval could not be removed by `files: []`, and the
# baseline would not actually be instructions-off. Keeping the eval neutral is what gives the
# A/B a genuine instructions-off baseline.
#
# VALLY VERSION: `vally experiment` is not available in vally 0.5.0 (which ships only
# lint/eval/grade). This file follows the same schema as the skills experiment so both
# light up when a vally with `experiment` support is installed. With that vally, from an
# isolated empty directory (paths inside the experiment resolve relative to this file):
#   mkdir /tmp/instructions-eval && cd /tmp/instructions-eval
#   vally experiment run <repo>/eng/instructions-evals/instructions-vs-baseline.experiment.yaml --output-dir .
#
# UNDER VALLY 0.5.0 (today), reproduce the A/B from an isolated empty directory so Vally
# cannot discover the repository instructions from its process working directory. Use two
# plain `vally eval` runs — no extra tooling and no duplicated instruction file:
#   baseline (instructions off): run the neutral eval directly —
#       vally eval -e <repo>/eng/instructions-evals/copilot-instructions/eval.vally.yaml
#   current  (instructions on):  make a TEMPORARY copy of that eval that adds an
#       environment.files overlay of .github/copilot-instructions.md, then run `vally eval` on
#       the copy. Discard the copy afterward.
# Those two runs correspond exactly to the `baseline` and `current` variants declared below.
evals:
  - "copilot-instructions/eval.vally.yaml"

overrides:
  runs: 5

vary:
  - /environment/files

baseline: baseline

variants:
  baseline:
    environment:
      files: []
  current:
    environment:
      files:
        - src: "../../.github/copilot-instructions.md"
          dest: ".github/copilot-instructions.md"
